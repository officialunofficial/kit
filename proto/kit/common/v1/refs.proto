// SPDX-License-Identifier: MIT OR Apache-2.0
//
// Shared ref types used across kit's wire protocols. Used by
// kit.rpc.v1.ssh (rust/crates/kit-rpc/proto/kit/rpc/v1/ssh/ssh.proto) and by the
// kit.transport.v1 remote protocol.
//
// This file is the single source of truth for these two types. The wire
// numbers below are load-bearing. A change that renumbers a field or
// removes a value breaks every consumer.
//
// Versioning: this file is v1 of the shared ref vocabulary.
// Wire-compatible additions (new enum values, new fields with default
// values) ship as patches. Breaking changes (renumbered fields,
// removed values) bump the file to refs2.proto and consumers opt in
// explicitly.

edition = "2023";

package kit.common.v1;

// ----------------------------------------------------------------------------
// CAS semantics for ref-update RPCs across every kit wire protocol.
// Wire numbers are load-bearing. Do NOT renumber; new variants append.

enum RefExpectation {
  // Protocol error if sent (the proto default). Servers MUST reject.
  REF_EXPECTATION_UNSPECIFIED = 0;

  // "Clobber" / last-writer-wins. `expected_id` MUST be empty.
  REF_EXPECTATION_ANY = 1;

  // "Create only". The ref MUST NOT already exist. `expected_id` MUST
  // be empty. (ANY overwrites an existing ref; MISSING conflicts on
  // it.)
  REF_EXPECTATION_MISSING = 2;

  // Compare-and-swap. `expected_id` MUST be the 32-byte current value.
  REF_EXPECTATION_MATCH = 3;
}

// A single ref and the object it points at.
message RefEntry {
  string name = 1;        // e.g. "refs/heads/main" (kit ref-name grammar)
  bytes object_id = 2;    // raw 32-byte BLAKE3 digest
}
