# Rust CI for kit on Cloud Build. Every step must pass for the build to pass.
# The steps run in parallel on one VM and share the /workspace volume. See
# cloudbuild/README.md for the scope, the triggers and the split with GitHub
# Actions.
#
# The toolchain, protoc, nextest, sccache, mold and the other pinned tools come
# from the baked _CI_IMAGE (cloudbuild/Dockerfile.ci). The steps only run cargo
# and the scripts of this repository.
#
# Triggers:
#   kit-ci-main   push to main
#   kit-ci-pr     pull requests to main. A maintainer comment `/gcbrun` starts
#                 a pull request from an external contributor.
#
# STEP GRAPH
#   Every step starts at once except the test steps that need the archive:
#   nextest-1..3 and ignored-lane wait for nextest-archive.
#   Each compiling step has its own CARGO_TARGET_DIR, so no Cargo lock couples
#   two steps. nextest-archive keeps the default target directory because the
#   archived binaries run from that path.
#
# CACHING: sccache with a GCS backend. The build runs as a service account, so
# sccache reaches the bucket through the metadata server with no key file. The
# service account needs roles/storage.objectAdmin on $_CACHE_BUCKET.
#
# The macOS test leg cannot run here (Linux containers only). It stays on
# GitHub Actions (.github/workflows/macos.yml).

substitutions:
  _CACHE_BUCKET: ${PROJECT_ID}-kit-sccache
  _CI_IMAGE: us-east4-docker.pkg.dev/${PROJECT_ID}/docker/kit-ci:rust-1.99.1

options:
  # The trigger runs this config as a dedicated service account. Cloud Build
  # rejects a custom account with no log option.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_32
  diskSizeGb: 200
  # The substitution values contain the built-in ${PROJECT_ID}. Cloud Build
  # resolves a built-in inside a substitution value only with dynamic
  # substitutions.
  dynamicSubstitutions: true

timeout: 5400s

steps:
  # Formatting. No compile, so it finishes first.
  - name: ${_CI_IMAGE}
    id: fmt
    waitFor: ['-']
    timeout: 600s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
    args:
      - -c
      - |
        set -euo pipefail
        cd rust
        cargo fmt --check

  # Clippy over every target and feature, then the minimum Rust version gate. The
  # baked image holds the declared minimum version, so a locked `cargo check` of
  # every target equals a build with the oldest supported compiler. The step fails
  # when the image compiler, `rust-version` and rust-toolchain.toml disagree.
  - name: ${_CI_IMAGE}
    id: lint
    waitFor: ['-']
    timeout: 2400s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=4"
      - "CARGO_TARGET_DIR=/tmp/target-lint"
      - "CARGO_PROFILE_TEST_CODEGEN_UNITS=256"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        ( cd rust || exit 1
          failed=0
          cargo fetch --locked || failed=1
          cargo clippy --locked --all-targets --all-features --workspace -- -D warnings || failed=1
          # One crate alone with its default features can hide code that
          # the all-features run above keeps alive.
          for crate in $(cargo metadata --locked --no-deps --format-version 1 \
              | python3 -I -c 'import json, sys; print(*[p["name"] for p in json.load(sys.stdin)["packages"]])'); do
            cargo clippy --locked --all-targets -p "$crate" -- -D warnings || failed=1
          done
          msrv=$(awk -F\" '/^[[:space:]]*rust-version[[:space:]]*=/ {print $2; exit}' Cargo.toml) || failed=1
          rustc_v=$(rustc --version | awk '{print $2}') || failed=1
          echo "declared minimum=$msrv, image rustc=$rustc_v"
          if [ -z "$msrv" ] || [ "$rustc_v" != "$msrv" ]; then
            echo "The image compiler differs from rust-version. Rebuild the image or fix rust-version." >&2
            failed=1
          fi
          if ! grep -q "channel = \"$msrv\"" rust-toolchain.toml; then
            echo "rust-toolchain.toml does not pin the declared minimum version." >&2
            failed=1
          fi
          cargo check --locked --workspace --all-targets || failed=1
          exit "$failed"
        ) || status=1
        sccache --show-stats
        exit "$status"

  # Rustdoc with warnings denied, so a broken link fails the build.
  - name: ${_CI_IMAGE}
    id: docs
    waitFor: ['-']
    timeout: 1500s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=4"
      - "CARGO_TARGET_DIR=/tmp/target-docs"
      - "RUSTDOCFLAGS=-Dwarnings"
    args:
      - -c
      - |
        set -euo pipefail
        cd rust
        cargo doc --locked --workspace --all-features --no-deps
        sccache --show-stats

  # Build every workspace test binary once. The partitions and the ignored lane
  # run from this archive and never compile. Only this step links with mold, and
  # `--build-jobs` bounds the compiler processes so the steps share one VM
  # without memory pressure. The step prints one `ci-timing` line. The first runs
  # use it to record the effect of mold and of the job bound (see README.md).
  # The archive and the target directory stay on the shared /workspace volume,
  # because the archived binaries run from that path.
  - name: ${_CI_IMAGE}
    id: nextest-archive
    waitFor: ['-']
    timeout: 3000s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "RUSTFLAGS=-C link-arg=-fuse-ld=mold"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
    args:
      - -c
      - |
        set -euo pipefail
        cd rust
        status=0
        start=$(date +%s)
        cargo nextest archive --locked --workspace --all-features --build-jobs 4 --archive-file /workspace/nextest-archive.tar.zst || status=1
        end=$(date +%s)
        echo "ci-timing: step=nextest-archive linker=mold build-jobs=4 seconds=$((end - start)) status=$status"
        sccache --show-stats
        exit "$status"

  # Workspace tests split into 3 partitions that run at the same time. The
  # steps differ only in the partition number. scripts/ci-nextest.sh holds the
  # environment and the command, so a change happens in one place.
  - name: ${_CI_IMAGE}
    id: nextest-1
    waitFor: [nextest-archive]
    timeout: 2400s
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bash scripts/ci-nextest.sh 1

  - name: ${_CI_IMAGE}
    id: nextest-2
    waitFor: [nextest-archive]
    timeout: 2400s
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bash scripts/ci-nextest.sh 2

  - name: ${_CI_IMAGE}
    id: nextest-3
    waitFor: [nextest-archive]
    timeout: 2400s
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        bash scripts/ci-nextest.sh 3

  # The serial lane for tests that need real timers or a real ssh(1). It runs
  # from the same archive as the partitions.
  - name: ${_CI_IMAGE}
    id: ignored-lane
    waitFor: [nextest-archive]
    timeout: 3000s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "KIT_TEST_STRICT=1"
    args:
      - -c
      - |
        set -euo pipefail
        cd rust
        cargo nextest run --archive-file /workspace/nextest-archive.tar.zst --workspace-remap /workspace/rust \
          --profile ignored-lane --no-fail-fast --run-ignored ignored-only

  # nextest does not run doctests, so this step does.
  - name: ${_CI_IMAGE}
    id: tests-misc
    waitFor: ['-']
    timeout: 1500s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=4"
      - "CARGO_TARGET_DIR=/tmp/target-misc"
      - "KIT_TEST_STRICT=1"
    args:
      - -c
      - |
        set -euo pipefail
        cd rust
        cargo test --locked --doc --workspace --no-fail-fast
        # The workspace run unifies features. These runs check the libkit
        # feature sets one by one.
        cargo test --locked -p libkit --no-default-features
        cargo test --locked -p libkit
        cargo test --locked -p libkit --no-default-features --features git-bridge,transport-file,transport-ssh
        cargo test --locked -p libkit --no-default-features --features transport-s3,transport-connect,history-mmr,sparse-checkout
        cargo test --locked -p libkit --all-features
        sccache --show-stats

  # `kit version` must print exactly `kit <X.Y.Z>`.
  - name: ${_CI_IMAGE}
    id: version
    waitFor: ['-']
    timeout: 1500s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=4"
      - "CARGO_TARGET_DIR=/tmp/target-version"
    args:
      - -c
      - |
        set -euo pipefail
        cd rust
        cargo build --locked -p kit-bin --bin kit
        out=$(/tmp/target-version/debug/kit version)
        expected="kit $(awk -F\" '/^version/ {print $2; exit}' Cargo.toml)"
        echo "stdout:   [$out]"
        echo "expected: [$expected]"
        test "$out" = "$expected"
        sccache --show-stats

  # The default `kit` build stays free of server code.
  - name: ${_CI_IMAGE}
    id: cli-baseline
    waitFor: ['-']
    timeout: 900s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
    args:
      - -c
      - |
        set -euo pipefail
        bash scripts/check-cli-baseline.sh

  # kit-client builds for wasm32 with the default and the minimal feature set.
  # kit-wasm builds for wasm32 as a release build. Then the smoke test runs the
  # generated bindings under Node.
  - name: ${_CI_IMAGE}
    id: wasm
    waitFor: ['-']
    timeout: 1500s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=4"
      - "CARGO_TARGET_DIR=/tmp/target-wasm"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        ( cd rust || exit 1
          failed=0
          cargo build --locked -p kit-client --target wasm32-unknown-unknown || failed=1
          cargo build --locked -p kit-client --no-default-features --target wasm32-unknown-unknown || failed=1
          cargo build --locked -p kit-wasm --release --target wasm32-unknown-unknown || failed=1
          exit "$failed"
        ) || status=1
        bash scripts/wasm-smoke.sh || status=1
        sccache --show-stats
        exit "$status"

  # The fuzz bodies run as unit tests. Then every libFuzzer target builds and
  # runs for 5 seconds. The nightly toolchain date must equal the date in
  # Dockerfile.ci. One cargo-fuzz build compiles every target, because a build
  # per target links each one again and takes about two minutes. The call names
  # the gnu target, because the prebuilt cargo-fuzz defaults to musl and the
  # sanitizer does not support musl. Each target then runs as its binary.
  - name: ${_CI_IMAGE}
    id: fuzz-smoke
    waitFor: ['-']
    timeout: 4500s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=8"
      - "CARGO_TARGET_DIR=/tmp/target-fuzz"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        ( cd rust || exit 1
          failed=0
          cargo test --locked -p kit-fuzz --no-fail-fast || failed=1
          cargo check --locked -p kit-fuzz --features libfuzzer --bins || failed=1
          exit "$failed"
        ) || status=1
        ( cd rust/fuzz || exit 1
          failed=0
          cargo +nightly-2026-10-01 fuzz build --target x86_64-unknown-linux-gnu --features libfuzzer || failed=1
          for path in fuzz_targets/*.rs; do
            target=$(basename "$path" .rs)
            echo "fuzz target: $target"
            mkdir -p "corpus/$target" "artifacts/$target"
            "/tmp/target-fuzz/x86_64-unknown-linux-gnu/release/$target" \
              "-artifact_prefix=artifacts/$target/" -max_total_time=5 "corpus/$target" || failed=1
          done
          exit "$failed"
        ) || status=1
        sccache --show-stats
        exit "$status"

  # Spec checks, then the independent Python checks of the golden vectors. The
  # Python checks share no code with the Rust crates. The virtual environment
  # holds the exact versions of scripts/golden/requirements.txt.
  - name: ${_CI_IMAGE}
    id: golden
    waitFor: ['-']
    timeout: 1200s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        bash scripts/check-spec-status.sh || status=1
        python3 -I -B scripts/check-spec-magics.py || status=1
        bash scripts/check-crypto-stack-version.sh || status=1
        python3 -I -B scripts/check-dependency-versions.py || status=1
        bash scripts/test-check-dependency-versions.sh || status=1
        python3 -I -B scripts/check-format-constants.py || status=1
        bash scripts/test-check-format-constants.sh || status=1
        python3 -m venv /tmp/ref-venv
        /tmp/ref-venv/bin/pip install --require-virtualenv -r scripts/golden/requirements.txt
        PYTHON=/tmp/ref-venv/bin/python bash scripts/check-golden.sh || status=1
        exit "$status"

  # The checked-in protocol code matches the .proto files. The regeneration
  # scripts write below rust/target, so the step works on a copy of the source
  # and leaves the shared target directory alone. The copy keeps .git, because
  # the scripts compare the generated files with git.
  - name: ${_CI_IMAGE}
    id: generated
    waitFor: ['-']
    timeout: 1500s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "RUSTC_WRAPPER=/workspace/scripts/ci-rustc-wrapper.sh"
      - "SCCACHE_GCS_BUCKET=${_CACHE_BUCKET}"
      - "SCCACHE_GCS_RW_MODE=READ_WRITE"
      - "SCCACHE_GCS_KEY_PREFIX=ci"
      - "CARGO_BUILD_JOBS=4"
    args:
      - -c
      - |
        set -euo pipefail
        mkdir /tmp/kit-generated
        tar --exclude=target -C /workspace -cf - . | tar -C /tmp/kit-generated -xf -
        git config --global --add safe.directory /tmp/kit-generated
        cd /tmp/kit-generated
        bash scripts/check-generated-fresh.sh
        sccache --show-stats

  # The writing rules over the tree and the form of new commit messages. The commit scan
  # needs a checkout with an origin/main ref and skips itself without one.
  - name: ${_CI_IMAGE}
    id: writing
    waitFor: ['-']
    timeout: 600s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        git config --global --add safe.directory /workspace
        bash scripts/check-writing.sh || status=1
        bash scripts/test-check-writing.sh || status=1
        bash scripts/test-check-commit-messages.sh || status=1
        base=""
        if git rev-parse --verify --quiet origin/main >/dev/null; then
          base=$(git merge-base HEAD origin/main)
        fi
        if [ -n "$base" ] && [ "$base" != "$(git rev-parse HEAD)" ]; then
          bash scripts/check-writing.sh --commits "$base..HEAD" || status=1
          python3 -I -B scripts/check-commit-messages.py "$base..HEAD" || status=1
        else
          echo "No base commit: skipping the commit message scan."
        fi
        bash scripts/check-doc-paths.sh || status=1
        bash scripts/test-check-doc-paths.sh || status=1
        bash scripts/test-install.sh || status=1
        exit "$status"

  # Every unsafe site has a SAFETY comment, every crate root declares its unsafe
  # policy and the unsafe count of each crate stays under its ceiling. cargo-geiger
  # runs without the compiler wrapper because it drives rustc itself.
  - name: ${_CI_IMAGE}
    id: unsafe
    waitFor: ['-']
    timeout: 2400s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
      - "CARGO_INCREMENTAL=0"
      - "RUST_BACKTRACE=short"
      - "CARGO_PROFILE_DEV_DEBUG=0"
      - "CARGO_PROFILE_TEST_DEBUG=0"
      - "CARGO_BUILD_JOBS=4"
      - "CARGO_TARGET_DIR=/tmp/target-geiger"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        git config --global --add safe.directory /workspace
        bash scripts/check-unsafe-safety.sh || status=1
        bash scripts/check-unsafe-policy.sh || status=1
        bash scripts/check-geiger-baseline.sh || status=1
        exit "$status"

  # cargo-deny and cargo-audit. The ignore list of cargo-audit must equal the
  # ignore list in rust/deny.toml (scripts/test-ci-gates.py checks this). The
  # deadline check fails when the date in rust/deny.toml has passed.
  - name: ${_CI_IMAGE}
    id: supply
    waitFor: ['-']
    timeout: 900s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
    args:
      - -c
      - |
        set -euo pipefail
        status=0
        deadline=$(grep -oP 'TODO\(\K\d{4}-\d{2}-\d{2}(?=\))' rust/deny.toml | head -n1)
        if [ -z "$deadline" ]; then
          echo "rust/deny.toml has no TODO(YYYY-MM-DD) deadline." >&2
          exit 1
        fi
        today=$(date -u +%Y-%m-%d)
        if [[ "$today" > "$deadline" || "$today" == "$deadline" ]]; then
          echo "The advisory ignore in rust/deny.toml expired on $deadline (today: $today)." >&2
          status=1
        fi
        run_audit() {
          cargo audit --deny warnings \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0370 \
            --ignore RUSTSEC-2026-0371 \
            --ignore RUSTSEC-2026-0372 \
            --ignore RUSTSEC-2026-0391 \
            --ignore RUSTSEC-2026-0395 \
            --ignore RUSTSEC-2026-0396 \
            --ignore RUSTSEC-2026-0397 \
            --ignore RUSTSEC-2026-0398 \
            --ignore RUSTSEC-2026-0399 \
            --ignore RUSTSEC-2026-0400 \
            --ignore RUSTSEC-2026-0401 \
            --ignore RUSTSEC-2026-0402 \
            --ignore RUSTSEC-2026-0403 \
            --ignore RUSTSEC-2026-0404 \
            --ignore RUSTSEC-2026-0405 \
            --ignore RUSTSEC-2026-0406
        }
        ( cd rust || exit 1
          failed=0
          cargo deny --locked check || failed=1
          run_audit || failed=1
          exit "$failed"
        ) || status=1
        exit "$status"

  # The GitHub workflow files that remain are well formed.
  - name: ${_CI_IMAGE}
    id: workflows
    waitFor: ['-']
    timeout: 300s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
    args:
      - -c
      - |
        set -euo pipefail
        actionlint

  # The invariants of this file and of the wrapper script.
  - name: ${_CI_IMAGE}
    id: ci-gates
    waitFor: ['-']
    timeout: 300s
    entrypoint: bash
    env:
      - "CARGO_TERM_COLOR=always"
    args:
      - -c
      - |
        set -euo pipefail
        python3 -I -B scripts/test-ci-gates.py
