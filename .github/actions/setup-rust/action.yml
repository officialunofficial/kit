name: Set up Rust
description: >-
  Install the Rust toolchain, (optionally) protoc, and a lockfile-keyed cargo
  cache. Consolidates the toolchain + protoc + cache trio that the CI workflows
  (macos.yml, formal.yml and others) otherwise duplicate, so the pinned action
  SHAs and the protoc version live in exactly one place.

inputs:
  components:
    description: Comma/space-separated rustup components (e.g. "rustfmt, clippy").
    required: false
    default: ""
  targets:
    description: Additional rustup targets (e.g. "wasm32-unknown-unknown").
    required: false
    default: ""
  cache-prefix:
    description: >-
      Swatinem/rust-cache prefix-key. MUST be unique per workflow + per runner:
      partitioning the key this way stops a malicious PR from poisoning a cache
      that a privileged workflow (e.g. release.yml, which carries publish tokens
      and id-token: write) would later read. See docs/RELEASE.md.
    required: true
  protoc:
    description: >-
      Install protoc. Required by any job that builds kit-rpc (buffa-build
      shells out to protoc; the .proto schemas use Edition 2023, needing
      protoc >= 25, newer than apt's protobuf-compiler). Set "false" for jobs
      that never compile kit-rpc (e.g. the keystore-only matrix).
    required: false
    default: "true"
  protoc-version:
    description: protoc release to install when protoc is enabled.
    required: false
    default: "31.0"

runs:
  using: composite
  steps:
    # rust/rust-toolchain.toml is the one source of the version.
    - name: Read the pinned toolchain
      id: pin
      shell: bash
      run: echo "version=$(bash "$GITHUB_WORKSPACE/scripts/toolchain-version.sh")" >> "$GITHUB_OUTPUT"

    - name: Install Rust ${{ steps.pin.outputs.version }}
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
      with:
        toolchain: ${{ steps.pin.outputs.version }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    # arduino/setup-protoc fetches an upstream release binary (works on every
    # runner). github.token raises the GitHub API rate limit for the download;
    # composite actions can't read secrets, but github.token is the job's
    # GITHUB_TOKEN and is available here.
    - name: Install protoc
      if: ${{ inputs.protoc == 'true' }}
      uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b  # v3.0.0
      with:
        version: ${{ inputs.protoc-version }}
        repo-token: ${{ github.token }}

    - name: Cache cargo registry and target
      uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
      with:
        workspaces: rust -> rust/target
        prefix-key: ${{ inputs.cache-prefix }}
        cache-on-failure: false
        cache-bin: false
