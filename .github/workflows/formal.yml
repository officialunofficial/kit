name: "Nightly: Formal verification"

# The formal-verification layers of docs/FORMAL.md, one job per layer. Each
# job calls a script under formal/scripts, so a developer runs the same
# command locally. The jobs run nightly and on demand, not per pull request:
# the Quint job runs exhaustive TLC instances and the Kani job runs about 40
# CBMC harnesses one at a time, which is too long to gate every pull request.
#
# Tool pins: Quint 0.32.0 (npm), Apalache 0.62.2 (release archive, sha256
# checked by formal/scripts/setup-apalache.sh), Java 21 (Temurin), Kani
# 0.68.0, Rust from RUST_VERSION below (rust/rust-toolchain.toml).
#
# Every result these jobs report is bounded or sampled. A green run is not a
# proof.

on:
  schedule:
    # 05:00 UTC daily: after fuzz.yml's 04:00 slot.
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.95.0"
  QUINT_VERSION: "0.32.0"
  KANI_VERSION: "0.68.0"

jobs:
  quint:
    name: quint + TLC (check.sh default mode)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'

      - name: Install quint
        run: npm install -g "@informalsystems/quint@${QUINT_VERSION}"

      # TLC is the tlc2.TLC class inside the Apalache jar, so this job needs
      # Apalache even though it runs no Apalache check.
      - name: Install Apalache (sha256-verified)
        run: bash formal/scripts/setup-apalache.sh

      - name: Quint models (quint typecheck/test/run + every TLC run)
        run: bash formal/scripts/run-quint.sh --all

      - name: Fixtures reproduce from the model
        run: CHECK=1 bash formal/scripts/gen-refs-traces.sh

  kani:
    name: kani (all harnesses)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # protoc: the mkit-rpc harnesses build mkit-rpc (buffa-build).
      - name: Set up Rust and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-prefix: "formal-kani"
          protoc: "true"

      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version "${KANI_VERSION}"
          cargo kani setup

      - name: Kani harnesses
        run: bash formal/scripts/run-kani.sh

  conformance:
    name: conformance (ITF replay)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Rust and cache
        uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-prefix: "formal-conformance"
          protoc: "false"

      - name: Replay the refs traces
        working-directory: rust
        run: cargo test --locked -p mkit-formal-conformance
