name: "Release: verify distribution channels"

# Manually dispatched verification that kit actually installs and works
# from every distribution channel this project ships — crates.io,
# the curl-pipe install script, cargo binstall, and Homebrew — each in an
# isolated environment. This is the automated, multi-channel completion of
# docs/RELEASE.md's "Smoke test" section (which scripts/release-smoke.sh
# already mechanizes for the GitHub Release archive itself); this workflow
# extends that same idea across every OTHER channel. NOT a release gate:
# nothing here runs automatically on push or pull_request. Dispatch it
# manually against an already-published version — typically right after
# cutting a release, or periodically to catch drift in a channel nobody
# happened to test by hand. Windows is not a supported target (see
# docs/INVARIANTS.md), so there is no Windows/Scoop channel to verify.
#
# CURRENT LIMITATION (as of 2026-07-14, before the repository is public):
# install.sh, cargo binstall's prebuilt-binary path, and Homebrew all
# resolve through GitHub Releases or a tap that mirrors them — all of
# which need the repo to be PUBLIC for anonymous access. The Homebrew tap
# also doesn't have a real formula yet (see docs/RELEASE.md's pre-release
# checklist). Until the repo goes public AND a real release has gone
# through the distribution flow, expect `install-script` and `homebrew`
# below to fail, and `cargo-binstall` to silently fall back to a
# from-source build instead of fetching a prebuilt binary. `cargo-install`
# is unaffected, because crates.io is public regardless of this repo's
# visibility.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to verify, no leading v (e.g. 0.3.0)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-install:
    name: cargo install kit-cli (crates.io)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Read the pinned toolchain
        id: pin
        run: echo "version=$(bash scripts/toolchain-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: ${{ steps.pin.outputs.version }}

      - name: cargo install kit-cli
        run: |
          cargo install kit-cli --version "${{ inputs.version }}" --locked --root "$RUNNER_TEMP/cargo-install"

      - name: Basic flow smoke
        run: bash scripts/basic-flow-smoke.sh "$RUNNER_TEMP/cargo-install/bin/kit" "${{ inputs.version }}"

  cargo-binstall:
    name: cargo binstall kit-cli
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Read the pinned toolchain
        id: pin
        run: echo "version=$(bash scripts/toolchain-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: ${{ steps.pin.outputs.version }}

      - name: Install cargo-binstall
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe  # v2
        with:
          tool: cargo-binstall

      # While the repo is private, binstall's pkg-url (GitHub Releases)
      # 404s and it falls back to `cargo install` — see the limitation
      # note at the top of this file. Same command either way; only the
      # fetch path differs once the repo goes public.
      - name: cargo binstall kit-cli
        run: |
          cargo binstall kit-cli --version "${{ inputs.version }}" --locked --no-confirm --root "$RUNNER_TEMP/cargo-binstall"

      - name: Basic flow smoke
        run: bash scripts/basic-flow-smoke.sh "$RUNNER_TEMP/cargo-binstall/bin/kit" "${{ inputs.version }}"

  install-script:
    name: install.sh (${{ matrix.image }})
    # See the limitation note at the top of this file — expected to fail
    # until the repo is public. Not `continue-on-error` on purpose: a
    # silently-green "expected failure" is worse than a red job someone
    # has to notice is stale once the repo goes public.
    # debian/ubuntu (apt, glibc) + fedora (dnf, glibc) — deliberately no
    # Alpine leg: kit's release archives are glibc-only
    # (x86_64/aarch64-unknown-linux-gnu, see release.yml's build matrix),
    # and neither install.sh nor docs/INSTALL.md claims musl/Alpine
    # support. Testing it would need an undocumented `gcompat` shim just
    # to run the downloaded (glibc) binary, which would test a
    # compatibility path kit doesn't actually support rather than a
    # real distribution channel.
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:bookworm-slim", "ubuntu:24.04", "fedora:latest"]
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    steps:
      - name: Install curl/ca-certificates (Debian/Ubuntu)
        if: startsWith(matrix.image, 'debian') || startsWith(matrix.image, 'ubuntu')
        run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates tar

      - name: Install curl/ca-certificates (Fedora)
        if: startsWith(matrix.image, 'fedora')
        run: dnf install -y curl ca-certificates tar

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Runs the install.sh AT THIS COMMIT (not curl-piped from the live
      # kit.storage domain) so this tests the script content actually under
      # review, matching the "test what's in this tree"
      # principle used elsewhere in this repo's CI.
      - name: Run install.sh
        env:
          KIT_VERSION: "v${{ inputs.version }}"
        run: bash install.sh

      - name: Basic flow smoke
        run: |
          bin="$(command -v kit || echo "$HOME/.local/bin/kit")"
          bash scripts/basic-flow-smoke.sh "$bin" "${{ inputs.version }}"

  homebrew:
    name: brew install (macOS)
    # See the limitation note at the top of this file — expected to fail
    # until officialunofficial/homebrew-tap has a real Formula/kit.rb.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: brew tap + install
        run: |
          brew tap officialunofficial/tap https://github.com/officialunofficial/homebrew-tap
          brew install officialunofficial/tap/kit

      # Homebrew's own `test do` block is the
      # formula-idiomatic smoke test; run it in addition to the shared
      # basic-flow check so a formula-level regression surfaces even if
      # someone edits the formula without touching this workflow.
      - name: brew test
        run: brew test officialunofficial/tap/kit

      - name: Basic flow smoke
        run: bash scripts/basic-flow-smoke.sh "$(command -v kit)" "${{ inputs.version }}"
