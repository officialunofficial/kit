name: "Security: Rust"

# Supply-chain gates for the Rust workspace.
#
#   deny    cargo-deny: advisories, licenses, bans and sources, as set in
#           rust/deny.toml
#   audit   cargo-audit over the lockfile, with the same ignore list as
#           rust/deny.toml [advisories.ignore]
#
# Both run on every pull request and push to `main`. They also run every
# Monday: a new advisory can match an UNCHANGED dependency tree, and no file
# edit would trigger a run then.
#
# REMINDER: rust/deny.toml ignores RUSTSEC-2023-0071 (yubikey transitive RSA
# decrypt timing leak). The `ignore-deadline` job fails when the
# re-justification date in that file has passed. See also
# rust/crates/kit-keystore/tests/no_rsa_decrypt.rs.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ignore-deadline:
    name: advisory ignore deadline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The TODO(YYYY-MM-DD) deadline is read from rust/deny.toml, the single
      # source of truth, so this step cannot drift from the ignore it gates.
      - name: Check the RUSTSEC-2023-0071 ignore has not expired
        run: |
          set -euo pipefail
          deadline=$(grep -oP 'TODO\(\K\d{4}-\d{2}-\d{2}(?=\))' rust/deny.toml | head -n1)
          if [ -z "$deadline" ]; then
            echo "::error::Could not find a TODO(YYYY-MM-DD) deadline in rust/deny.toml for RUSTSEC-2023-0071" >&2
            exit 1
          fi
          today=$(date -u +%Y-%m-%d)
          if [[ "$today" > "$deadline" || "$today" == "$deadline" ]]; then
            echo "::error::RUSTSEC-2023-0071 ignore in rust/deny.toml expired on $deadline (today: $today). Re-justify or drop the ignore (see rust/deny.toml and rust/crates/kit-keystore/tests/no_rsa_decrypt.rs)." >&2
            exit 1
          fi
          echo "RUSTSEC-2023-0071 ignore still valid until $deadline (today: $today)."

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: "1.95.0"

      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe  # v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        working-directory: rust
        run: cargo deny --locked check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: "1.95.0"

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      # Keep the --ignore list in lockstep with rust/deny.toml
      # [advisories.ignore].
      - name: cargo audit (rust workspace)
        working-directory: rust
        run: cargo audit --deny warnings --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2025-0055 --ignore RUSTSEC-2026-0370 --ignore RUSTSEC-2026-0371 --ignore RUSTSEC-2026-0372

  # One stable name for branch protection.
  security-gate:
    name: Rust security gate
    if: always()
    needs:
      - ignore-deadline
      - deny
      - audit
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of the needed jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a security job ended with: $result"
              exit 1
            fi
          done
