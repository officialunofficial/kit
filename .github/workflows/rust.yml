name: "CI: Rust"

# The required gates for every change. Each job runs one check, so a failure
# names its cause.
#
#   fmt, clippy       formatting and `clippy -D warnings` over the workspace
#   test, test-macos  nextest, doctests, the version contract and the serial
#                     ignored lane on Linux; macOS runs on `main` only
#   msrv              `cargo check` with the declared minimum Rust version
#   fuzz-smoke        the iterated fuzz bodies as unit tests, then every
#                     libFuzzer target for a few seconds
#   golden            spec status and the independent Python checks of the
#                     golden vectors
#   cli-baseline      the default `kit` build stays free of server code
#   unsafe-baseline   cargo-geiger ceilings and a SAFETY comment on every
#                     `unsafe` site
#   generated         the checked-in protocol code matches the .proto files
#   writing           no tracker ids, plan labels or tool names in the tree
#   deny, audit       cargo-deny and cargo-audit: see rust-security.yml
#
# Left out on purpose: a coverage upload (it needs a third-party token) and a
# TPM signer leg (the TPM signer is not part of this repository).
#
# macOS runners cost ten times a Linux minute, so the macOS test leg runs on
# pushes to `main` and on demand, not on every pull request.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short
  RUST_VERSION: "1.95.0"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
          cache-prefix: rust-fmt
          protoc: "false"
      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
          cache-prefix: rust-clippy
          protoc: "false"
      - name: cargo clippy -D warnings
        working-directory: rust
        run: cargo clippy --locked --all-targets --all-features --workspace -- -D warnings

  test:
    name: test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-prefix: rust-test-linux
          protoc: "false"
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe  # v2
        with:
          tool: cargo-nextest
      - name: Build the workspace
        working-directory: rust
        run: cargo build --locked --workspace
      # Tests that need `git` or a real key store fail loudly instead of
      # returning early when their tool is missing.
      - name: cargo nextest
        working-directory: rust
        env:
          KIT_TEST_STRICT: "1"
        run: cargo nextest run --locked --workspace --all-features --no-fail-fast --profile ci
      # nextest does not run doctests.
      - name: Doctests
        working-directory: rust
        run: cargo test --locked --doc --workspace --no-fail-fast
      # `kit version` must print exactly "kit <X.Y.Z>".
      - name: Version contract
        working-directory: rust
        run: |
          out=$(./target/debug/kit version)
          expected="kit $(awk -F'"' '/^version/ {print $2; exit}' Cargo.toml)"
          echo "stdout:   [$out]"
          echo "expected: [$expected]"
          test "$out" = "$expected"
      # The serial lane for tests that need real timers or a real ssh(1).
      - name: Ignored lane
        working-directory: rust
        env:
          KIT_TEST_STRICT: "1"
        run: cargo nextest run --locked --workspace --all-features --profile ignored-lane --run-ignored ignored-only

  # macOS runs on `main` and on demand only. See the note at the top.
  test-macos:
    name: test (macos)
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-prefix: rust-test-macos
          protoc: "false"
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe  # v2
        with:
          tool: cargo-nextest
      - name: cargo nextest
        working-directory: rust
        run: cargo nextest run --locked --workspace --all-features --no-fail-fast --profile ci
      - name: Doctests
        working-directory: rust
        run: cargo test --locked --doc --workspace --no-fail-fast

  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Read the declared minimum Rust version
        id: msrv
        run: |
          msrv=$(awk -F'"' '/^[[:space:]]*rust-version[[:space:]]*=/ {print $2; exit}' rust/Cargo.toml)
          test -n "$msrv"
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
      # The pinned toolchain file in rust/ must equal the declared minimum,
      # so a local build and this job use the same compiler.
      - name: Check rust-toolchain.toml matches
        run: grep -q "channel = \"${{ steps.msrv.outputs.version }}\"" rust/rust-toolchain.toml
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
          cache-prefix: rust-msrv
          protoc: "false"
      - name: cargo check
        working-directory: rust
        run: cargo check --locked --workspace --all-targets

  fuzz-smoke:
    name: fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-prefix: rust-fuzz-smoke
          protoc: "false"
      # The target bodies run as ordinary unit tests under the guardrails of
      # docs/FUZZ.md: a fixed seed, an iteration cap and a time cap.
      - name: Fuzz bodies as unit tests
        working-directory: rust
        run: cargo test --locked -p kit-fuzz --no-fail-fast
      - name: Every libFuzzer target builds
        working-directory: rust
        run: cargo check --locked -p kit-fuzz --features libfuzzer --bins
      # A short libFuzzer run of every target. The nightly workflow
      # (fuzz.yml) runs each target for longer.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable action, nightly toolchain
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2
      - name: libFuzzer smoke run (5 s per target)
        working-directory: rust/fuzz
        run: |
          set -euo pipefail
          for path in fuzz_targets/*.rs; do
            target=$(basename "$path" .rs)
            echo "::group::$target"
            cargo +nightly fuzz run "$target" --features libfuzzer -- -max_total_time=5
            echo "::endgroup::"
          done
      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: fuzz-smoke-crashes
          path: |
            rust/fuzz/fuzz/artifacts/**
            rust/fuzz/artifacts/**
          if-no-files-found: ignore
          retention-days: 14

  golden:
    name: spec and golden checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Every spec has a recognized status
        run: bash scripts/check-spec-status.sh
      # The Python checks share no code with the Rust crates. They are the
      # independent reference for the golden vectors.
      - name: Install the Python reference dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ref-venv"
          "$RUNNER_TEMP/ref-venv/bin/pip" install --require-virtualenv -r scripts/golden/requirements.txt
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-prefix: rust-golden
          protoc: "false"
      - name: Install b3sum
        run: cargo install --locked b3sum --version 1.8.7
      - name: Part-upload vectors (BLAKE3 subtree merge)
        run: >-
          "$RUNNER_TEMP/ref-venv/bin/python" scripts/golden/blake3_subtree_ref.py
          rust/tests/golden/uploads/subtree-merge.json
          --part-json rust/tests/golden/auth-v2/part.json
          --jobs 4
      - name: Grant vectors
        run: '"$RUNNER_TEMP/ref-venv/bin/python" scripts/golden/grants_ref.py rust/tests/golden/grants'
      - name: Object, tag and chunker vectors
        run: python3 -I -B scripts/golden/objects_ref.py rust/tests/golden
      - name: Redaction vectors
        run: python3 scripts/check-redaction-goldens.py

  cli-baseline:
    name: default CLI baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-prefix: rust-cli-baseline
          protoc: "false"
      - name: Check the default CLI dependency graph
        run: bash scripts/check-cli-baseline.sh

  unsafe-baseline:
    name: unsafe baseline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Every unsafe site has a SAFETY comment
        run: bash scripts/check-unsafe-safety.sh
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          cache-prefix: rust-geiger
          protoc: "false"
      - name: Install cargo-geiger
        run: cargo install --locked cargo-geiger --version 0.13.0
      - name: Unsafe ceiling per first-party crate
        run: bash scripts/check-geiger-baseline.sh

  generated:
    name: generated code is fresh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # The schemas use protobuf edition 2023, which needs protoc 27 or newer.
      - uses: ./.github/actions/setup-rust
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
          cache-prefix: rust-generated
          protoc: "true"
      - name: Regenerate and compare
        run: bash scripts/check-generated-fresh.sh

  writing:
    name: writing rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: No tracker ids, plan labels or tool names
        run: bash scripts/check-writing.sh
      - name: Cited paths and links exist
        run: bash scripts/check-doc-paths.sh
      - name: The installer binds the signature to the requested tag
        run: bash scripts/test-install.sh

  # One stable name for branch protection. It fails when any job above fails
  # or is cancelled. A skipped job (the macOS leg on a pull request) passes.
  rust-ci-gate:
    name: Rust CI gate
    if: always()
    needs:
      - fmt
      - clippy
      - test
      - test-macos
      - msrv
      - fuzz-smoke
      - golden
      - cli-baseline
      - unsafe-baseline
      - generated
      - writing
    runs-on: ubuntu-latest
    steps:
      - name: Check the results of the needed jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a required job ended with: $result"; exit 1 ;;
            esac
          done
