name: "Bench: kit vs git"

# Temporary: compares the clone of 10,000 small files for kit on main, the
# previous commit of this branch, this branch and git, then runs
# scripts/bench-vs-git.sh with this branch.

on:
  push:
    branches:
      - claude/project-thread-qo0kjb

permissions:
  contents: read

jobs:
  bench:
    name: bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache-prefix: bench-vs-git-${{ matrix.os }}
          protoc: "false"
      - name: Install hyperfine
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q hyperfine; else brew install hyperfine; fi
      - name: Build this branch
        working-directory: rust
        run: cargo build --release --locked -p kit-bin --bin kit
      - name: Build main
        run: |
          git worktree add -q ../base a7d02bde
          (cd ../base/rust && cargo build --release --locked -p kit-bin --bin kit)
      - name: Build the previous commit
        run: |
          git worktree add -q ../prev d0e3aa9b
          (cd ../prev/rust && cargo build --release --locked -p kit-bin --bin kit)
      - name: Clone A/B
        run: |
          NEW="$PWD/rust/target/release/kit"
          OLD="$(cd ../base && pwd)/rust/target/release/kit"
          PREV="$(cd ../prev && pwd)/rust/target/release/kit"
          W="$(mktemp -d)"; W="$(cd "$W" && pwd -P)"
          python3 - "$W/small10k" <<'PY'
          import os, sys
          root = sys.argv[1]
          rng = __import__("random").Random(10000)
          for d in range(100):
              os.makedirs(f"{root}/d{d:02}", exist_ok=True)
              for f in range(100):
                  with open(f"{root}/d{d:02}/f{f:02}.bin", "wb") as out:
                      out.write(rng.randbytes(1024))
          PY
          mkdir -p "$W/src/kit" "$W/src/git" "$W/remotes/kit"
          (cd "$W/src/kit" && "$NEW" init >/dev/null 2>&1 && "$NEW" keygen >/dev/null 2>&1 && cp -R "$W/small10k/" . \
            && "$NEW" add . >/dev/null && "$NEW" commit -m bench >/dev/null 2>&1 \
            && "$NEW" remote add origin "kit+file://$W/remotes/kit" >/dev/null && "$NEW" push origin >/dev/null 2>&1)
          (cd "$W/src/git" && git init -q -b main && git config user.email b@b && git config user.name b && cp -R "$W/small10k/" . \
            && git add . && git commit -q -m bench && git clone -q --bare --no-local . "$W/remotes/git.git")
          cd "$W"
          for k in "$OLD" "$PREV" "$NEW"; do "$k" clone "kit+file://$W/remotes/kit" check >/dev/null && test -f check/d42/f17.bin && rm -rf check; done
          for i in 1 2; do
            hyperfine -N --warmup 2 --runs 20 --export-json "ab$i.json" \
              --prepare 'rm -rf work' -n main "$OLD clone kit+file://$W/remotes/kit work" \
              --prepare 'rm -rf work' -n prev "$PREV clone kit+file://$W/remotes/kit work" \
              --prepare 'rm -rf work' -n branch "$NEW clone kit+file://$W/remotes/kit work" \
              --prepare 'rm -rf work' -n git "git clone -q file://$W/remotes/git.git work"
            python3 - "ab$i.json" <<'PY'
          import json, sys
          for name, r in zip(["main", "prev", "branch", "git"], json.load(open(sys.argv[1]))["results"]):
              t = r.get("summary", {}).get("time_wall_clock", r)
              print("EXACT-AB", name, repr(t["mean"]), repr(t["stddev"]), repr(t["median"]), repr(t["min"]))
          PY
          done
      - name: Bench
        run: |
          scripts/bench-vs-git.sh rust/target/release/kit bench-results/run1 | tee bench-1.log
          python3 - bench-results/run1 <<'PY'
          import glob, json, os, sys
          for path in sorted(glob.glob(os.path.join(sys.argv[1], "*.json"))):
              for r in json.load(open(path))["results"]:
                  t = r.get("summary", {}).get("time_wall_clock", r)
                  print("EXACT", os.path.basename(path)[:-5], repr(t["mean"]), repr(t["stddev"]))
          PY
