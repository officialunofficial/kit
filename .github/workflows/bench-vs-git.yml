name: "Bench: kit vs git"

# Temporary: runs scripts/bench-vs-git.sh on hosted runners for this branch.

on:
  push:
    branches:
      - claude/project-thread-qo0kjb

permissions:
  contents: read

jobs:
  bench:
    name: bench (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-prefix: bench-vs-git-${{ matrix.os }}
          protoc: "false"
      - name: Install hyperfine
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q hyperfine; else brew install hyperfine; fi
      - name: Build
        working-directory: rust
        run: cargo build --release --locked -p kit-bin --bin kit
      - name: Bench
        run: |
          for i in 1 2; do
            scripts/bench-vs-git.sh rust/target/release/kit "bench-results/run$i" | tee "bench-$i.log"
            python3 - "bench-results/run$i" <<'PY'
          import glob, json, os, sys
          for path in sorted(glob.glob(os.path.join(sys.argv[1], "*.json"))):
              for r in json.load(open(path))["results"]:
                  s = r.get("summary", {}).get("time_wall_clock", r)
                  print("EXACT", os.path.basename(path)[:-5], repr(s["mean"]), repr(s["stddev"]), len(r.get("times", [])), sorted(r))
          PY
            { echo '```'; sed -n '/== summary/,$p' "bench-$i.log"; cat "bench-results/run$i/sizes.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: bench-results-${{ matrix.os }}
          path: bench-results
