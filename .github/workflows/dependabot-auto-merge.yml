name: "Meta: Dependabot auto-merge"

# Merge Dependabot pull requests that are patch or minor bumps, once the
# `Rust CI gate` check passes. `main` has no required checks, so GitHub's own
# auto-merge would merge a red pull request at once. This job waits for the
# gate itself and leaves a pull request open when the gate fails. Major bumps
# and pull requests from other authors are untouched.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write
  checks: read

# A newer push to the pull request replaces the job that waits on the old one.
concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Enable auto-merge
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # A grouped pull request reports the highest update type in the group,
      # so a group with any major bump is skipped.
      - name: Merge patch and minor updates after the Rust CI gate passes
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          # Poll the gate check of this head commit. The gate runs when the
          # pull request opens or changes, so it can lag the first poll.
          for _ in $(seq 1 360); do
            result=$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100" \
              --jq '[.check_runs[] | select(.name == "Rust CI gate")] | if length == 0 then "missing" elif .[0].status != "completed" then "pending" else .[0].conclusion end')
            echo "Rust CI gate: $result"
            case "$result" in
              success)
                gh pr merge --squash "$PR_URL"
                exit 0
                ;;
              missing | pending)
                sleep 20
                ;;
              *)
                echo "::warning::Rust CI gate ended with $result, so the pull request stays open."
                exit 0
                ;;
            esac
          done
          echo "::error::Rust CI gate did not finish in time."
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
