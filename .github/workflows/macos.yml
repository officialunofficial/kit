name: "CI: macOS"

# The macOS test leg. Cloud Build runs Linux containers only, so this leg
# stays on GitHub Actions. Every other gate runs on Cloud Build (see
# cloudbuild/README.md).
#
# macOS runners cost ten times a Linux minute. The leg runs on pushes to
# `main` and on demand, not on every pull request.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: short

jobs:
  test-macos:
    name: test (macos)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-prefix: rust-test-macos
          protoc: "false"
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe  # v2
        with:
          tool: cargo-nextest
      # Tests that need `git` or a real key store fail loudly instead of
      # returning early when their tool is missing.
      - name: cargo nextest
        working-directory: rust
        env:
          KIT_TEST_STRICT: "1"
        run: cargo nextest run --locked --workspace --all-features --no-fail-fast --profile ci
      # nextest does not run doctests.
      - name: Doctests
        working-directory: rust
        run: cargo test --locked --doc --workspace --no-fail-fast
