name: "Bench: macOS clone profile"

# Temporary: times the checkout of 10,000 small files on macOS for kit on
# main, kit on this branch with and without threads, and git.

on:
  push:
    branches:
      - claude/project-thread-qo0kjb

permissions:
  contents: read

jobs:
  profile:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-rust
        with:
          cache-prefix: bench-vs-git-macos-latest
          protoc: "false"
      - name: Install hyperfine
        run: brew install hyperfine
      - name: Build
        working-directory: rust
        run: cargo build --release --locked -p kit-bin --bin kit
      - name: Build main
        run: |
          git worktree add -q ../base f1d837b5
          (cd ../base/rust && cargo build --release --locked -p kit-bin --bin kit)
      - name: Profile
        run: |
          K="$PWD/rust/target/release/kit"
          M="$(cd ../base && pwd)/rust/target/release/kit"
          W="$(mktemp -d)"; W="$(cd "$W" && pwd -P)"
          python3 - "$W/small10k" <<'PY'
          import os, sys
          root = sys.argv[1]
          rng = __import__("random").Random(10000)
          for d in range(100):
              os.makedirs(f"{root}/d{d:02}", exist_ok=True)
              for f in range(100):
                  with open(f"{root}/d{d:02}/f{f:02}.bin", "wb") as out:
                      out.write(rng.randbytes(1024))
          PY
          mkdir -p "$W/src/kit" "$W/src/git" "$W/remotes/kit"
          (cd "$W/src/kit" && "$K" init >/dev/null 2>&1 && "$K" keygen >/dev/null 2>&1 && cp -R "$W/small10k/" . \
            && "$K" add . >/dev/null && "$K" commit -m bench >/dev/null 2>&1 \
            && "$K" remote add origin "kit+file://$W/remotes/kit" >/dev/null && "$K" push origin >/dev/null 2>&1)
          (cd "$W/src/git" && git init -q -b main && git config user.email b@b && git config user.name b && cp -R "$W/small10k/" . \
            && git add . && git commit -q -m bench && git clone -q --bare --no-local . "$W/remotes/git.git")
          cd "$W"
          KP="rm -rf work && $K clone -q -n kit+file://$W/remotes/kit work"
          GP="rm -rf work && git clone -q -n file://$W/remotes/git.git work"
          for i in 1 2 3; do
            hyperfine -N --warmup 2 --runs 15 --export-json "p$i.json" \
              --prepare "$KP" -n main "$M -C work checkout main" \
              --prepare "$KP" -n branch "$K -C work checkout main" \
              --prepare "$KP" -n branch-1thread "env RAYON_NUM_THREADS=1 $K -C work checkout main" \
              --prepare "$KP" -n branch-2threads "env RAYON_NUM_THREADS=2 $K -C work checkout main" \
              --prepare "$GP" -n git "git -C work reset -q --hard" \
              --prepare 'rm -rf work' -n clone-main "$M clone -q kit+file://$W/remotes/kit work" \
              --prepare 'rm -rf work' -n clone-branch "$K clone -q kit+file://$W/remotes/kit work" \
              --prepare 'rm -rf work' -n clone-git "git clone -q file://$W/remotes/git.git work"
            python3 - "p$i.json" <<'PY'
          import json, sys
          for r in json.load(open(sys.argv[1]))["results"]:
              t = r.get("summary", {}).get("time_wall_clock", r)
              print("PHASE", r.get("name", r["command"]), round(t["mean"] * 1000), "+-", round(t["stddev"] * 1000), "median", round(t["median"] * 1000))
          PY
          done
