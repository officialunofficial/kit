name: "Bench: macOS clone profile"

# Temporary: compares ways to write 10,000 small files on macOS.

on:
  push:
    branches:
      - claude/project-thread-qo0kjb

permissions:
  contents: read

jobs:
  profile:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Write patterns
        run: |
          cat > w.py <<'PY'
          import os, sys, time, shutil, threading, itertools
          from concurrent.futures import ThreadPoolExecutor
          data = os.urandom(1024)
          base = os.path.realpath(sys.argv[1])
          counter = itertools.count()
          def tmp_rename(d, n):
              t = f"{d}/.tmp.{next(counter)}"
              fd = os.open(t, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o644)
              os.write(fd, data); os.fstat(fd)
              os.rename(t, f"{d}/{n}")
              os.close(fd)
          def direct(d, n):
              fd = os.open(f"{d}/{n}", os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o644)
              os.write(fd, data); os.close(fd); os.lstat(f"{d}/{n}")
          def tmp_dir_rename(d, n):
              t = f"{base}/.stage/{next(counter)}"
              fd = os.open(t, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o644)
              os.write(fd, data); os.fstat(fd)
              os.rename(t, f"{d}/{n}")
              os.close(fd)
          def run(name, write, threads, order):
              root = f"{base}/w"
              shutil.rmtree(root, ignore_errors=True); shutil.rmtree(f"{base}/.stage", ignore_errors=True)
              os.makedirs(f"{base}/.stage")
              dirs = [f"{root}/d{i:02}" for i in range(100)]
              for d in dirs: os.makedirs(d)
              if order == "bydir":
                  jobs = [(d, f"f{j:02}") for d in dirs for j in range(100)]
              else:
                  jobs = [(d, f"f{j:02}") for j in range(100) for d in dirs]
              t0 = time.perf_counter()
              if threads == 1:
                  for d, n in jobs: write(d, n)
              elif order == "dirs":
                  def worker(k):
                      for d in dirs[k::threads]:
                          for j in range(100): write(d, f"f{j:02}")
                  with ThreadPoolExecutor(threads) as ex: list(ex.map(worker, range(threads)))
              else:
                  with ThreadPoolExecutor(threads) as ex: list(ex.map(lambda a: write(*a), jobs, chunksize=16))
              return (time.perf_counter() - t0) * 1000
          cases = [
              ("direct-1", direct, 1, "bydir"),
              ("tmp-1", tmp_rename, 1, "bydir"),
              ("tmp-3-samedir", tmp_rename, 3, "bydir"),
              ("tmp-3-dirs", tmp_rename, 3, "dirs"),
              ("tmp-6-dirs", tmp_rename, 6, "dirs"),
              ("direct-3-dirs", direct, 3, "dirs"),
              ("stage-3-dirs", tmp_dir_rename, 3, "dirs"),
          ]
          results = {c[0]: [] for c in cases}
          for rnd in range(5):
              for c in cases:
                  results[c[0]].append(run(*c))
          for name, ts in results.items():
              ts.sort()
              print("WRITE", name, "median", round(ts[len(ts)//2]), "min", round(ts[0]), "all", [round(t) for t in ts])
          PY
          sysctl -n hw.ncpu
          python3 w.py "$(mktemp -d)"
