name: "Nightly: Fuzz"

# Nightly libfuzzer smoke run for the workspace targets.
# Each target runs for ~60 s; this is a
# spot-check, not a campaign. Failures are surfaced but do not block
# anything because (a) cargo-fuzz needs nightly so toolchain churn is
# a known source of flakes, and (b) we have not yet wired corpus
# persistence. Tighten `continue-on-error` once the harness is stable.
#
# Manual repro:
#   cd rust/fuzz && cargo +nightly fuzz run delta --features libfuzzer -- -max_total_time=60

on:
  schedule:
    # 04:00 UTC daily — pick a low-contention window.
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        target: [delta, pack, tree, software_key_record, rpc_decode, ssh_session, git_commit_parse, git_tag_parse, git_tree_parse, merkle_packlist, merkle_proof, sparse_verify, disclosure_decode, verify_disclosure, pack_entries, verify_closure, grant_parse, epoch_visibility_parse, span_decode, verify_span, config_parse, stash_list, bridge_map, envelope_decode, ref_wire_decode, fetch_cursor_record, index_decode, history_order_decode, conflict_state_decode, sparse_wire_decode, git_object_parse, repo_identity_parse, commitment_parse, ignore_parse, pack_cursor_decode, chunked_blob_build, trust_roots_parse, ssh_url_parse, ssh_cursor_reply, s3_cursor_listing, grant_fields_parse, name_rules]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable action, nightly toolchain
        with:
          toolchain: nightly

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31  # v2
        with:
          # cargo-fuzz builds inside rust/fuzz with its own target dir,
          # but pulls workspace deps from rust/. Cache both.
          workspaces: |
            rust -> rust/target
            rust/fuzz -> rust/fuzz/target
          prefix-key: "rust-fuzz-${{ matrix.target }}"
          cache-on-failure: false

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2

      - name: Run fuzz target (${{ matrix.target }}, 60s)
        working-directory: rust/fuzz
        run: |
          # libfuzzer-sys is gated behind the `libfuzzer` feature (see
          # each fuzz package Cargo.toml) so a plain `cargo build`/`cargo test`
          # never pulls the nightly-only crate into stable builds.
          # cargo-fuzz does not infer required-features on its own, so
          # this must be passed explicitly or every target fails at the
          # build step with "requires the features: libfuzzer".
          cargo +nightly fuzz run ${{ matrix.target }} --features libfuzzer -- -max_total_time=60

      - name: Upload crash artifacts on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: |
            rust/fuzz/fuzz/artifacts/**
            rust/fuzz/artifacts/**
          if-no-files-found: ignore
          retention-days: 14
