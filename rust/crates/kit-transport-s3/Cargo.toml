[package]
name = "kit-transport-s3"
description = "S3-compatible conditional-write transport for kit, with SigV4 signing over rustls"
keywords = ["kit", "transport", "s3", "sigv4"]
categories = ["network-programming"]
readme = "README.md"
# Ship the sources only. The tests use goldens and helpers that live outside
# this package, so they cannot run from a published copy.
include = ["src/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Publishable to crates.io. `publish` left unset (cargo default = true).

[lints]
workspace = true

[dependencies]
# Inter-workspace dep needs an explicit `version = ...` alongside the
# path so `cargo publish` accepts it.
kit-core = { version = "=0.11.0", path = "../kit-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking"] }
# A pack `PUT` runs on the async client, on a runtime of its own, so a
# stalled upload can be ended (the blocking client bounds a request with a
# body only in total).
tokio = { version = "1.54.1", default-features = false, features = ["rt", "sync", "time"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
http-body = "1.1.0"
http = "1.5.0"
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"] }
bytes = "1.12.2"
sha2 = "0.11.1"
hmac = "0.13.0"
md-5 = "0.11.0"
hex = "0.4.3"

[features]
default = []
# Wire-level sparse-checkout fetch. Mirrors the
# kit-core feature; both must be enabled together. Off by default.
sparse-checkout = ["kit-core/sparse-checkout"]

[dev-dependencies]
kit-test-util = { path = "../kit-test-util" }
mockito = "1.7.2"
serde_json = "1.0.154"

# cargo-machete matches the crate name `md-5` to the identifier `md_5`.
# The library of that crate is named `md5`, and src/lib.rs has `use md5::...`.
[package.metadata.cargo-machete]
ignored = ["md-5"]

[package.metadata.docs.rs]
# Build docs with every feature so docs.rs renders the feature-gated API.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
