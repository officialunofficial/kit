[package]
name = "kit-transport-s3"
description = "S3-compatible conditional-write transport for kit, with SigV4 signing over rustls"
keywords = ["kit", "transport", "s3", "sigv4"]
categories = ["network-programming"]
readme = "README.md"
# Ship the sources only. The tests use goldens and helpers that live outside
# this package, so they cannot run from a published copy.
include = ["src/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Publishable to crates.io. `publish` left unset (cargo default = true).

[lints]
workspace = true

[dependencies]
# Inter-workspace dep needs an explicit `version = ...` alongside the
# path so `cargo publish` accepts it.
kit-core = { version = "=0.7.1", path = "../kit-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "blocking"] }
sha2 = "0.11.1"
hmac = "0.13.0"
md-5 = "0.11.0"
hex = "0.4.3"

[features]
default = []
# Wire-level sparse-checkout fetch. Mirrors the
# kit-core feature; both must be enabled together. Off by default.
sparse-checkout = ["kit-core/sparse-checkout"]
# Test-only: shrinks `S3_SINGLE_PUT_MAX` and the internal
# multipart part size to small values (single-digit MiB) so the
# multipart-upload integration test can drive the real
# CreateMultipartUpload -> UploadPart -> CompleteMultipartUpload flow
# against a mockito server without allocating or transferring
# multi-GiB buffers. MUST NOT be enabled in a production build — the
# shrunk `S3_SINGLE_PUT_MAX` is not a valid S3 API limit. Excluded
# from the docs.rs feature set below for that reason.
test-small-multipart-caps = []

[dev-dependencies]
mockito = "1.7.2"
serde_json = "1.0.154"
# tests/transport_minio.rs: a real MinIO container, proving this crate's
# SigV4 signing is accepted by a genuine independent S3-API
# implementation rather than only the in-process mockito stub
# transport_mockito.rs uses. `blocking` on both: this crate's tests are
# plain `#[test]`, not async.
testcontainers = { version = "0.27.3", features = ["blocking"] }
testcontainers-modules = { version = "0.15.0", features = ["minio", "blocking"] }

# Multipart-upload round-trip test, gated behind `test-small-multipart-caps`
# (see that feature's doc comment above) so a plain `cargo test` doesn't
# need to move real multi-GiB buffers to exercise the multipart path.
[[test]]
name = "transport_multipart"
required-features = ["test-small-multipart-caps"]

# cargo-machete matches the crate name `md-5` to the identifier `md_5`.
# The library of that crate is named `md5`, and src/lib.rs has `use md5::...`.
[package.metadata.cargo-machete]
ignored = ["md-5"]

[package.metadata.docs.rs]
# Build docs with the real (non-test) feature set so docs.rs renders the
# feature-gated API without advertising the test-only shrunk caps.
features = ["sparse-checkout"]
rustdoc-args = ["--cfg", "docsrs"]
