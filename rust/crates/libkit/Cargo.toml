[package]
name = "libkit"
description = "The kit library: one crate that re-exports the kit object model, attestations, keystore, sync engine and optional transports"
keywords = ["kit", "vcs", "content-addressed", "attestation", "library"]
categories = ["development-tools", "cryptography"]
readme = "README.md"
# Ship the sources only. The tests use features that need the whole workspace,
# so they cannot run from a published copy.
include = ["src/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = ["sync"]
# The native clone, fetch, pull and push engine.
sync = ["dep:kit-sync"]
# The kit and git import and export bridge. A pull and a fresh clone restore
# the tree through `kit-sync`, so the feature turns `sync` on.
git-bridge = ["dep:kit-git-bridge", "dep:serde", "dep:serde_json", "sync"]
transport-file = ["dep:kit-transport-file"]
transport-ssh = ["dep:kit-transport-ssh"]
transport-s3 = ["dep:kit-transport-s3"]
transport-connect = ["dep:kit-transport-connect"]
# Versioned first-parent ancestry snapshots. `kit-sync` publishes them when
# the `sync` feature is also on.
history-mmr = ["kit-core/history-mmr", "kit-sync?/history-mmr"]
# Verifiable sparse checkout. The S3 transport uses it when it is also on.
sparse-checkout = ["kit-core/sparse-checkout", "kit-transport-s3?/sparse-checkout"]

[dependencies]
kit-core = { version = "=0.6.0", path = "../kit-core" }
kit-attest = { version = "=0.6.0", path = "../kit-attest", features = ["grants"] }
kit-keystore = { version = "=0.6.0", path = "../kit-keystore" }
kit-sync = { version = "=0.6.0", path = "../kit-sync", optional = true }
kit-git-bridge = { version = "=0.6.0", path = "../kit-git-bridge", optional = true }
kit-transport-file = { version = "=0.6.0", path = "../kit-transport-file", optional = true }
kit-transport-ssh = { version = "=0.6.0", path = "../kit-transport-ssh", optional = true }
kit-transport-s3 = { version = "=0.6.0", path = "../kit-transport-s3", optional = true }
kit-transport-connect = { version = "=0.6.0", path = "../kit-transport-connect", optional = true }
# `serde` and `serde_json` read the claim of an import attestation. Only the
# `git-bridge` feature uses them.
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", optional = true }
# The nonce of a statement.
getrandom = "0.4.3"
tempfile = "3.27.0"
thiserror = "2.0.21"
zeroize = "1.9.1"

# The grant store opens a file without following a symlink.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
# Signs the grants in the tests of the grant store.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }

[package.metadata.docs.rs]
# Build docs with every feature so docs.rs renders the feature-gated modules.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
