[package]
name = "kit-transport-ssh"
description = "SSH transport for kit using a forced-command server pattern over a system ssh(1) child process"
keywords = ["kit", "vcs", "ssh", "transport"]
categories = ["network-programming", "data-structures"]
readme = "README.md"
# Ship the sources only. The tests use goldens and helpers that live outside
# this package, so they cannot run from a published copy.
include = ["src/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Publishable to crates.io. `publish` left unset (cargo default = true).

[lints]
workspace = true

[dependencies]
# Inter-workspace dep needs an explicit `version = ...` alongside the
# path so `cargo publish` accepts it.
kit-core = { version = "=0.8.0", path = "../kit-core" }
kit-rpc = { version = "=0.8.0", path = "../kit-rpc" }
buffa = "0.9.2"
thiserror = "2.0.21"

[package.metadata.docs.rs]
# Build docs with every feature so docs.rs renders the feature-gated API.
all-features = true
