[package]
name = "kit-transport-file"
description = "File-system transport for kit, used in tests and local content-addressed repositories"
keywords = ["kit", "vcs", "transport", "filesystem"]
categories = ["filesystem", "data-structures"]
readme = "README.md"
# Ship the sources only. The tests use goldens and helpers that live outside
# this package, so they cannot run from a published copy.
include = ["src/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Publishable to crates.io. `publish` left unset (cargo default = true).

[lints]
workspace = true

[dependencies]
# Inter-workspace dep needs an explicit `version = ...` alongside the
# path so `cargo publish` accepts it.
kit-core = { version = "=0.7.2", path = "../kit-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
tempfile = "3.27.0"
# Drives pushes against the transport in the crash tests of the two-ref
# advance.
kit-sync = { path = "../kit-sync", default-features = false }

[package.metadata.docs.rs]
# Build docs with every feature so docs.rs renders the feature-gated API.
all-features = true
