# Regenerates the protocol code that `kit-rpc` checks in under `generated/`.
# Run by `scripts/regen-rpc-proto.sh` and `scripts/regen-transport-proto.sh`.
#
# `publish = false`, never a dependency of anything. Keeping the code
# generators here keeps `buffa-build`, `connectrpc-build` and their tree out of
# the build of every crate that depends on `kit-rpc`.
[package]
name = "kit-rpc-codegen"
description = "Regenerates the protocol code kit-rpc checks in"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
buffa-build = "0.9.2"
connectrpc-build = "0.9.0"
