[package]
name = "kit-client"
description = "Runtime-independent async protocol client for kit servers: reads, signed writes and ticketed push on native and wasm"
readme = "README.md"
keywords = ["kit", "vcs", "client", "wasm", "connect"]
categories = ["network-programming", "web-programming::http-client"]
# Ship the sources only. The tests use goldens and helpers that live outside
# this package, so they cannot run from a published copy.
include = ["src/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Reading compressed packs (SPEC-PACKFILE v2) needs a zstd decoder. The default
# is the C backend. Push then writes compressed packs, and reads use the C
# decoder. It pulls in `zstd-sys`, so it does not build for wasm32.
default = ["pack-zstd"]
pack-zstd = ["kit-core/pack-zstd"]

[dependencies]
kit-core = { version = "=0.6.0", path = "../kit-core", default-features = false }
kit-rpc = { version = "=0.6.0", path = "../kit-rpc", features = ["transport-messages"] }
buffa = "0.9.2"
http = "1.5.0"
base64 = "0.23.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"


[dev-dependencies]
kit-test-util = { path = "../kit-test-util" }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }

[package.metadata.docs.rs]
# Build docs with every feature so docs.rs renders the feature-gated API.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
