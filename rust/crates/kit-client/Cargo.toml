[package]
name = "kit-client"
description = "Runtime-independent async protocol client for kit servers: reads, signed writes and ticketed push on native and wasm"
readme = "README.md"
keywords = ["kit", "vcs", "client", "wasm", "connect"]
categories = ["network-programming", "web-programming::http-client"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
# Reading compressed packs (SPEC-PACKFILE v2) needs a zstd decoder. The default
# is the C backend. Push then writes compressed packs, and reads use the C
# decoder. It pulls in `zstd-sys`, so it does not build for wasm32.
default = ["pack-zstd"]
pack-zstd = ["kit-core/pack-zstd"]

[dependencies]
kit-core = { version = "0.5", path = "../kit-core", default-features = false }
kit-rpc = { version = "0.5", path = "../kit-rpc", features = ["transport-messages"] }
buffa = "=0.9.1"
http = "=1.5.0"
base64 = "=0.22.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"


[dev-dependencies]
kit-test-util = { path = "../kit-test-util" }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc"] }
