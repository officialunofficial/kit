[package]
name = "kit-git-bridge"
description = "Deterministic kit↔git bridge: export translation (SPEC-GIT-BRIDGE) and importer-signed import (SPEC-GIT-IMPORT)"
keywords = ["kit", "git", "bridge", "export", "import"]
categories = ["development-tools"]
readme = "README.md"
# Ship the sources only. The tests use goldens and helpers that live outside
# this package, so they cannot run from a published copy.
include = ["src/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
kit-core = { version = "=0.5.0", path = "../kit-core" }
# git object ids are SHA-1 over "type len\0" + body. This is git's
# object-naming function, not a security boundary (SPEC-GIT-BRIDGE §2);
# integrity rides on the carried BLAKE3 + Ed25519 material.
sha1 = { version = "0.11.0", default-features = false }
# loose-object zlib encoding; default backend is the pure-Rust miniz_oxide.
flate2 = "1.1.10"

[dev-dependencies]
tempfile = "3.27.0"
kit-test-util = { path = "../kit-test-util" }

[package.metadata.docs.rs]
all-features = true
