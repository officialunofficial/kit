[package]
name = "kit-sync"
description = "Native clone, fetch, pull and push for .kit repositories, as a library that returns typed reports and prints nothing"
readme = "README.md"
keywords = ["kit", "vcs", "clone", "fetch", "sync"]
categories = ["development-tools", "filesystem"]
# Ship the sources only. The tests use goldens and helpers that live outside
# this package, so they cannot run from a published copy.
include = ["src/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# `default-features = false`: the zstd C backend is this crate's own
# `pack-zstd` feature (on by default), so an embedder can build without it.
kit-core = { version = "=0.7.2", path = "../kit-core", default-features = false }
# Fan-out of signature verification, ref reads and chunk reads.
rayon = "1.12.0"
# Private staging directory for downloaded packs.
tempfile = "3.27.0"
thiserror = "2.0.21"

# --- `client`: the kit-client backend -----------------------------------
kit-client = { version = "=0.7.2", path = "../kit-client", default-features = false, optional = true }
# Drives kit-client's futures to completion from the synchronous engine.
futures-executor = { version = "0.3.34", optional = true }

# --- `connect-native`: a small native HTTP channel -----------------------
# current-thread runtime only: no scheduler threads.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "sync"], optional = true }
hyper = { version = "1.12.0", default-features = false, features = ["client", "http1"], optional = true }
hyper-util = { version = "0.1.21", default-features = false, features = ["client-legacy", "http1", "tokio"], optional = true }
# ring, not aws-lc: no second C crypto library. No http2.
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "tls12", "ring"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
webpki-roots = { version = "1.0.11", optional = true }
http = { version = "1.5.0", optional = true }
http-body-util = { version = "0.1.5", optional = true }
# Counts connection establishments so a stale pooled connection is told apart
# from a fresh one.
tower-service = { version = "0.3.3", optional = true }
bytes = { version = "1.12.1", optional = true }
# gzip, pure-Rust backend. The only content coding the channel speaks.
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"], optional = true }
getrandom = { version = "0.4.3", optional = true }

[features]
default = ["pack-zstd"]
# Pack decode (and encode) through the zstd C library.
pack-zstd = ["kit-core/pack-zstd"]
# Publish versioned first-parent ancestry snapshots with branch writes.
history-mmr = ["kit-core/history-mmr"]

# `ClientSource`, the `RemoteSource` over `kit_client::Client` (anonymous or
# with an injected signer), for `kit+https` / `kit+http` remotes.
client = ["dep:kit-client", "dep:futures-executor"]
# `NativeHttp` + `NativeClock`: hyper/rustls on a current-thread runtime,
# gzip only; with default features disabled, no `zstd-sys` anywhere in the
# tree.
connect-native = [
    "client",
    "dep:tokio", "dep:hyper", "dep:hyper-util", "dep:hyper-rustls", "dep:rustls",
    "dep:webpki-roots", "dep:http", "dep:http-body-util", "dep:tower-service", "dep:bytes", "dep:flate2",
    "dep:getrandom",
]

[dev-dependencies]
proptest = "1.12.0"
kit-transport-connect = { path = "../kit-transport-connect" }
kit-test-util = { path = "../kit-test-util" }
http = "1.5.0"
kit-transport-memory = { path = "../kit-transport-memory" }
tokio = { version = "1.54.1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync"] }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
base64 = "0.23.1"
buffa = "0.9.2"

[[example]]
name = "gen_zstd_fixture"
# Writes a compressed pack, which needs the C zstd backend.
required-features = ["pack-zstd"]

[package.metadata.docs.rs]
# Build docs with every feature so docs.rs renders the feature-gated API.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
