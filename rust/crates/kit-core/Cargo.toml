[package]
name = "kit-core"
description = "Content-addressed VCS primitives for kit: BLAKE3 hashing, canonical objects, refs, packs, and transport traits"
keywords = ["kit", "vcs", "blake3", "content-addressed", "version-control"]
categories = ["data-structures", "encoding", "cryptography"]
readme = "README.md"
# Ship the sources only. The tests use goldens and helpers that live outside
# this package, so they cannot run from a published copy.
include = ["src/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Publishable to crates.io. Metadata-only PR — actual `cargo publish`
# is gated behind a separate release process. The `publish` key is
# left unset (cargo default = `true`) so a future `cargo publish -p
# kit-core` works without further metadata changes.

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
# Verified streaming (BLAKE3 tree hashing: outboard + slice proof) for
# `verify::verify_blob_slice`/`verify_blob_len_proof` (SPEC-DISCLOSURE). Pure Rust, `std`-based but only via
# `io::Cursor`-style in-memory use — no filesystem, no threads — so it
# builds cleanly for wasm32. `blake3 = "1"` above is the same workspace
# pin `bao::Hash` (a `blake3::Hash` re-export) resolves against, so no
# second major shows up in the tree.
bao = "0.13.1"
# `bytes::{Buf, BufMut}` back the `commonware-codec` Read/Write buffer
# traits used by the packlist node codec (transfer.rs). Pure, wasm-clean.
bytes = "1.12.1"
# commonware-* (compatible requirements at workspace root).
#
# `commonware-codec` is NON-optional: the transfer packlist node
# (transfer.rs) is encoded with it (idiomatic Option/Vec + RangeCfg cap).
# It is `default-features = false` (no `std`) and compiles to wasm32.
#
# The others are optional, gated by the feature flags below. NOTE on
# merkle identity: a merkelized object's id is a Binary Merkle Tree root
# (see `merkle.rs`). `merkle.rs` is an independent implementation over the
# `blake3` crate. It needs to rebuild a root from a proof, which
# `commonware_storage::bmt` does not offer. A native-only test checks it
# byte-for-byte against `commonware_storage::bmt` (see dev-dependencies).
commonware-codec = { workspace = true }
commonware-storage = { workspace = true, features = ["std"], optional = true }
commonware-cryptography = { workspace = true, features = ["std"], optional = true }
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc"] }
# The SPEC-SIGNING §1 predicate: canonical point checks, the cofactored
# equation and its batch form (`sign::verify_ed25519`). `alloc` provides the
# multiscalar multiplication of the batch check. `precomputed-tables` keeps
# the basepoint tables that make [s]B fast in signing and verification;
# `zeroize` clears scalars on drop.
curve25519-dalek = { version = "5.0.0", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
sha2 = { version = "0.11.1", default-features = false }
getrandom = "0.4.3"
# `delta::encode`'s block-hash index (a `HashMap<u64, u32>` keyed by an
# already well-distributed hash, not attacker-facing key material) uses
# `FxHasher`/`FxSeededState` instead of the default `SipHash` — see
# `delta.rs`'s module docs. Already resolved transitively (via
# `kit-bin`'s `reqwest` → `quinn` chain) at the pinned `2.1` line; this
# direct dependency makes that explicit rather than relying on it.
# `no_std`-by-default (this crate enables its default `std` feature) and
# pure arithmetic, so it stays wasm32-clean like the rest of this
# dependency list.
rustc-hash = "2.1.3"
# `subtle` is a constant-time-equality primitive used by the Ed25519
# `SecretSeed` PartialEq. dalek pulls it transitively but we depend on
# it directly so the constant-time guarantee is explicit at this crate
# boundary instead of relying on a transitive pin.
subtle = { version = "2.6.1", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.21"
zeroize = { version = "1.9.1", features = ["derive"] }
# Per-entry pack payload compression (SPEC-PACKFILE v2).
# `zstd-sys` is a C lib that cannot target wasm32 (see the comment on
# `commonware-storage` above) — this is `optional = true`, gated by the
# `pack-zstd` feature below, so a wasm32 consumer (which needs `pack.rs` to
# compile but never calls into pack compression) can opt out via
# `default-features = false`. 0.13.3 is already resolved transitively
# via the commonware dependency stack. This direct dependency uses the
# newer safe wrapper while sharing the same underlying zstd C library.
zstd = { version = "0.14.3", optional = true }
# POSIX uid + O_NOFOLLOW for the key file open path. Unix-only; the
# Windows path uses default ACLs as documented in `docs/specs/SPEC-SIGNING.md`.
[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# Keep the untargeted `getrandom = "0.4"` above for native builds
# (`KeyPair::generate`, ancestry ids). On wasm32-unknown-unknown the 0.4
# crate needs `wasm_js` (`Crypto.getRandomValues` via wasm-bindgen);
# without it, `cargo check -p kit-core --no-default-features --target
# wasm32-unknown-unknown` fails. A wasm32 consumer enables this feature on its root package,
# which unifies onto this copy. Do not enable on native.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

[features]
# `pack-zstd` is on by default for every normal (native) consumer —
# `PackWriter`/`PackReader` transparently compress/decompress pack
# entries per SPEC-PACKFILE v2 without any call-site changes. It is
# the one default feature that pulls a dependency outside the
# always-wasm-safe base, so every crate that targets
# wasm32-unknown-unknown opts out explicitly with
# `default-features = false` on its `kit-core` dependency.
default = ["pack-zstd"]
# SPEC-PACKFILE v2: zstd-compressed pack entries (`0x03`
# zstd-raw, `0x04` zstd-delta). Disabling this feature does not make
# `pack.rs` reject v2 packs at compile time — a build without it can
# still fail closed at runtime on a `0x03`/`0x04` entry — it only
# means this build's `PackWriter` never emits them and this build's
# `PackReader` can't decompress ones it receives.
pack-zstd = ["dep:zstd"]
# Canonical first-parent snapshots use the synchronous in-memory MMB primitive.
history-mmr = ["dep:commonware-storage", "dep:commonware-cryptography"]
# Sparse witnesses use the canonical Tree codec and the base BLAKE3 hasher.
sparse-checkout = []
# Exposes private parser seams to the `kit-fuzz` harness. Off by default.
fuzzing = []

[dev-dependencies]
# `hazmat::ExpandedSecretKey` (test-only): builds torsion-padded and
# small-order signatures with a real secret scalar for the `sign::verify_ed25519`
# tests.
# Additive on top of the plain `[dependencies]` entry above; never enabled
# outside test builds.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "hazmat"] }
# Storage experiments need the deterministic runtime, not the shipped history API.
commonware-runtime = { workspace = true }
commonware-utils = { workspace = true, features = ["std"] }
serde_json = "1.0.154"
# Native-only: cross-check `merkle.rs` against the canonical
# `commonware_storage::bmt`. Both must give the same roots and proof bytes.
commonware-storage = { workspace = true, features = ["std"] }
commonware-cryptography = { workspace = true, features = ["std"] }
hex = "0.4.3"
# Property-based testing: auto-shrinks counterexamples on round-trip
# / invariant assertions.
proptest = "1.12.0"

[package.metadata.docs.rs]
# Build docs with every feature so docs.rs renders the feature-gated API.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
