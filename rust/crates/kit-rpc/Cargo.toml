[package]
name = "kit-rpc"
description = "Versioned wire protocols for kit cross-system speech: external signers (signer.proto), SSH transport frames (ssh.proto), shared types (common.proto). Schemas defined in protobuf via buffa, with length-prefixed framing."
keywords = ["kit", "rpc", "protobuf", "buffa"]
categories = ["encoding", "data-structures"]
readme = "README.md"
# Ship the sources only. The tests use goldens and helpers that live outside
# this package, so they cannot run from a published copy.
include = ["src/**", "/build.rs", "/generated/**", "/proto/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# buffa-generated code inherits docstrings from our .proto comments,
# which clippy flags for missing backticks around protocol-name
# tokens (WebAuthn, ClientDataJSON, ED25519, …). The .proto is the
# source of truth and we don't want to backtick-hell the human
# documentation there. Override the workspace lint set for this crate
# only.
[lints.clippy]
# Drop pedantic + nursery + cargo for this crate. The buffa-generated
# code (~640 KiB into $OUT_DIR) inherits docstrings from our .proto
# files and uses code patterns that pedantic flags hundreds of times.
# We keep `clippy::all` (the correctness + style baseline) and our
# own hand-written code in src/ stays under it.
all = { level = "warn", priority = -1 }
# These three rules repeat the workspace policy. A crate cannot both inherit
# the workspace table and override it.
wildcard_imports = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

# Kani proof harnesses live in `#[cfg(kani)]` modules (`cargo kani` sets
# the cfg); declare it so normal builds don't flag it as unexpected.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[features]
# Shared wasm-clean TransportService and health messages and Connect bindings.
transport = ["transport-messages", "dep:connectrpc", "dep:connectrpc-build"]
# Canonical messages without Connect runtime bindings (no tokio dependency).
transport-messages = ["dep:serde", "buffa/json"]
# Opt-in `arbitrary::Arbitrary` derives on all generated wire types,
# for fuzzing / property tests (used by the rust/fuzz harness). Off by
# default so downstream consumers don't pull in `arbitrary`.
arbitrary = ["dep:arbitrary", "buffa/arbitrary"]

[dependencies]
# The `zstd` feature stays off: it pulls zstd 0.13, which has open advisories.
connectrpc = { version = "0.9.1", default-features = false, features = ["gzip", "json"], optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
arbitrary = { version = "1.5.0", optional = true }
buffa = "0.9.2"
thiserror = "2.0.21"
# kit-rpc now also re-exports a small set of shared transport-side
# frame helpers (cond_to_wire, rpc_error_to_transport, ref_entry_to_ref,
# unexpected_frame, body_name, MAX_REF_NAME, CHUNK_DATA_MAX) — used by
# kit-transport-ssh. Those helpers need
# `TransportError`, `Ref`, `RefWriteCondition`, and `validate_ref_name`
# from kit-core. kit-core does NOT depend on kit-rpc, so this is
# acyclic.
#
# `default-features = false`: same wasm32-safety rationale as
# kit-attest's edge to kit-core (see that crate's Cargo.toml) — this
# crate sits on the kit-attest -> kit-rpc -> kit-core path, and
# kit-core's default `pack-zstd` feature pulls a non-wasm32-buildable
# C dependency. Every other consumer of
# kit-rpc (kit-bin, kit-attest,
# kit-transport-ssh) also depends on kit-core directly with default
# features on, so their builds still get `pack-zstd` via that edge.
kit-core = { version = "=0.7.0", path = "../kit-core", default-features = false }

[build-dependencies]
connectrpc-build = { version = "0.9.0", optional = true }
buffa-build = "0.9.2"

# cargo-machete scans only the Rust sources under src/. It cannot see these
# dependencies, so it lists them as unused. Each one is used.
# - serde, connectrpc and arbitrary: the generated modules under generated/
#   name `::serde`, `::connectrpc` and `::arbitrary::Arbitrary`. build.rs
#   stages them into OUT_DIR, and src/lib.rs includes them.
# - buffa-build and connectrpc-build: build.rs calls them when
#   KIT_RPC_CODEGEN is set.
[package.metadata.cargo-machete]
ignored = ["arbitrary", "buffa-build", "connectrpc", "connectrpc-build", "serde"]

[package.metadata.docs.rs]
# Build docs with every feature so docs.rs renders the feature-gated API.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
