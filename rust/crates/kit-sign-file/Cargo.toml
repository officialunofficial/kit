[package]
name = "kit-sign-file"
description = "Reference external-signer binary: signs a DSSE PAE with a raw key read from disk. NOT a production signer — see SPEC-EXTERNAL-SIGNER.md"
keywords = ["kit", "attestation", "signer", "reference"]
categories = ["command-line-utilities", "cryptography"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Reference and test implementation for third-party signer integrators.
# Not shipped to crates.io. A production signer must not read a raw private
# key off the filesystem with a permissions check alone.
publish = false

[lints]
workspace = true

[[bin]]
name = "kit-sign-file"
path = "src/main.rs"

[dependencies]
# The attest crate supplies the canonical Algorithm enum, the typed errors
# and the per-algorithm signers. All three algorithms are on, so one binary
# signs under ed25519, secp256k1 or p256 depending on the request.
kit-attest = { version = "=0.6.0", path = "../kit-attest", default-features = false, features = ["algo-ed25519", "algo-secp256k1", "algo-p256"] }
# `KeyPair::from_seed` builds the Ed25519 signer.
kit-core = { version = "=0.6.0", path = "../kit-core" }
# The wire schemas and the length-prefixed framing of the subprocess protocol.
kit-rpc = { version = "=0.6.0", path = "../kit-rpc" }
buffa = "0.9.2"
zeroize = "1.9.1"

[dev-dependencies]
tempfile = "3.27.0"
