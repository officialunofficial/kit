[package]
name = "kit-keystore"
description = "Signing-key keystore abstraction for kit"
keywords = ["kit", "keystore", "signing", "cryptography"]
categories = ["cryptography", "authentication"]
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
default = []
attest = ["dep:kit-attest"]
backend-linux-secret-service = ["linux-secret-service"]
backend-macos-keychain = ["macos-keychain"]
fuzzing = []
linux-secret-service = [
  "dep:keyring-core",
  "dep:zbus-secret-service-keyring-store",
  "zbus-secret-service-keyring-store/rt-async-io-crypto-rust",
]
macos-keychain = ["dep:security-framework"]

[dependencies]
kit-core = { version = "0.5", path = "../kit-core" }
kit-attest = { version = "0.5", path = "../kit-attest", optional = true }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc"] }
getrandom = "=0.4.3"
keyring-core = { version = "=1.0.1", optional = true }
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }
sha2 = { version = "=0.11.1", default-features = false }
zeroize = "=1.9.1"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.191"

[dev-dependencies]
tempfile = "=3.27.0"
[package.metadata.docs.rs]
features = ["attest", "backend-linux-secret-service"]
