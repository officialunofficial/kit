# Native Transport and host-policy adapter over kit-client's canonical
# kit.transport.v1 per-RPC implementation. The CLI lends ClientSource for
# repository operations; remaining Transport callers keep this facade.
# Generated bindings and pooled HTTP utilities are public APIs.
[package]
name = "kit-transport-connect"
description = "Native Transport and host-policy adapter over the kit-client Connect protocol implementation"
keywords = ["kit", "vcs", "transport", "connectrpc", "client"]
categories = ["network-programming", "web-programming::http-client"]
readme = "README.md"
# Ship the sources only. The tests use goldens and helpers that live outside
# this package, so they cannot run from a published copy.
include = ["src/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints.clippy]
# Shared generated types inherit transport.proto docstrings that trip
# pedantic/nursery lints. Keep `clippy::all` (correctness + style baseline)
# and this crate's existing lint policy for handwritten client modules.
all = { level = "warn", priority = -1 }
# These three rules repeat the workspace policy. A crate cannot both inherit
# the workspace table and override it.
wildcard_imports = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
kit-sync = { version = "=0.7.0", path = "../kit-sync", default-features = false, features = ["connect-native"] }
kit-client = { version = "=0.7.0", path = "../kit-client", default-features = false }
kit-rpc = { version = "=0.7.0", path = "../kit-rpc", features = ["transport"] }
# Inter-workspace deps need explicit version + path so `cargo publish`
# accepts them.
kit-core = { version = "=0.7.0", path = "../kit-core" }

# ConnectRPC native client: hyper/hyper-util transport + rustls TLS.
# `UploadPack`/`DownloadPack`'s client-streaming/server-streaming RPCs work
# natively without a separate opt-in — connectrpc 0.9 dropped the
# `streaming` cargo feature (and `StreamingCompressionProvider`) entirely;
# streaming RPCs themselves are unaffected. `json` keeps the
# buffa-generated message types' serde derives (matches every other
# connectrpc consumer in this workspace).
connectrpc = { version = "0.9.1", default-features = false, features = [
    "client",
    "client-tls",
    "gzip",
    "json",
] }
buffa = "0.9.2"
base64 = "0.23.1"

# Async runtime driving the ConnectRPC client. The `Transport` trait (kit_core::protocol::Transport) is
# synchronous; `kit_sync::Executor` bridges the client side.
tokio = { version = "1.54.1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "net",
    "sync",
    "macros",
    "time",
] }

hyper = { version = "1.12.0", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "http2", "tls12", "ring"] }
pin-project-lite = "0.2.17"
tower-service = "0.3.3"
http = "1.5.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
futures = "0.3.34"
url = "2.5.8"

# CSPRNG for the write-envelope idempotency key (`envelope::EnvelopeTransport`)
# — same crate/version kit-core, kit-bin, and kit-keystore already pull in
# for their own random-value needs (key generation).
getrandom = "0.4.3"

# Pure-Rust TLS root store for `HttpClient::with_tls` (Mozilla root program
# via the `webpki-roots` crate) — no OS trust-store dependency.
webpki-roots = "1.0.11"

# Explicit dependency (beyond connectrpc's own re-export of `rustls`) so
# this crate can deterministically install a `ring`-backed default
# `CryptoProvider` regardless of what crypto backend(s) a consuming
# workspace's OTHER dependencies pull in for the same `rustls` version
# (`aws-lc-rs`, `ring`, or both) — see `tls::client_config`.
# `ring` needs no `cmake` (unlike `aws-lc-rs`), matching this crate's
# minimal-system-dependency posture.
rustls = { version = "0.23.46", features = ["ring"] }

[dev-dependencies]
kit-test-util = { path = "../kit-test-util" }
serde_json = "1.0.154"
kit-transport-memory = { version = "=0.7.0", path = "../kit-transport-memory" }
# Test-only: `envelope::tests::parity` independently re-verifies the write
# envelope headers `EnvelopeTransport` produces against a from-scratch
# implementation of the server-side envelope verification contract, so
# canonical-string or header regressions are caught without a live server.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["alloc", "rand_core"] }
hex = "0.4.3"
# `tests/roundtrip.rs`, `retry.rs` and `rpc_timeout.rs` build their own
# in-process `TransportService` servers directly against
# `connectrpc::server`/`Router` (the client-side regression gate —
# SPEC-TRANSPORT-CONNECT's testing decision), so connectrpc's `server`
# feature is a dev-only feature here.
connectrpc = { version = "0.9.1", default-features = false, features = [
    "client",
    "client-tls",
    "server",
    "gzip",
    "json",
] }

# Native TLS trust and streaming RPC regression fixture only.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["io-util"] }
