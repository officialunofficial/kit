# Model-based conformance of the formal models against the real code
# (ref conformance model). Test-only: the crate's library is empty
# and everything lives in `tests/`. A separate crate, not a `kit-core`
# integration test, because the refs model's lock domains include the
# file transport (`kit-transport-file`) and the memory transport
# (`kit-transport-memory`), both of which depend on `kit-core`.
#
# `publish = false`, never a dependency of anything. No third-party
# dependency beyond what the workspace already uses (`serde_json`,
# `tempfile`, both MIT OR Apache-2.0).
[package]
name = "kit-formal-conformance"
description = "Replays ITF traces of kit's Quint models against the real implementation"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]

[dev-dependencies]
kit-core = { path = "../kit-core" }
kit-transport-file = { path = "../kit-transport-file" }
kit-transport-memory = { path = "../kit-transport-memory" }
serde_json = "1.0.154"
tempfile = "3.27.0"
