# cargo-deny schema v2 (EmbarkStudios/cargo-deny >= 0.16). Severity keywords
# moved from per-check settings to the top level; what remains here are
# "scope" values: which dep set each check applies to.

[advisories]
version = 2
yanked = "deny"
ignore = [
    # TODO(2027-02-17): re-justify these ignores or drop them.
    # `paste` (macro crate) marked unmaintained 2024-10-07. Every build of
    # kit-core pulls it in through `commonware-codec`, which is not an
    # optional dependency. No runtime exposure: paste expands at compile
    # time and produces no binary code we own. The dependency comes in via
    # the commonware crates (https://github.com/commonwarexyz/monorepo) —
    # once commonware migrates off paste this ignore goes. Re-justify by
    # 2027-02-17.
    #
    # Re-confirmed 2026-11-04 on the commonware 2026.11.0 train:
    # `cargo tree -i paste` shows v1.0.15 entering as a proc-macro via
    # commonware-codec -> kit-core.
    { id = "RUSTSEC-2024-0436", reason = "transitive via commonware-codec; macro-only, no runtime exposure. Re-justify by 2027-02-17." },
    # RUSTSEC-2025-0055 (tracing-subscriber 0.2.25 ANSI-escape log
    # injection) REMOVED 2026-07-15: it came in via commonware-runtime
    # 2026.5.x -> arkworks (ark-ed-on-bls12-381-bandersnatch ->
    # ark-r1cs-std 0.5.0) -> tracing-subscriber 0.2, for the evrf/
    # "golden" DKG curve. On the commonware 2026.7.0 train that whole
    # arkworks/bandersnatch chain is gone from the dependency graph
    # (`cargo update` dropped ark-bls12-381, ark-ec,
    # ark-ed-on-bls12-381-bandersnatch, ark-ff, ark-poly, ark-r1cs-std,
    # ark-relations, ark-serialize, ark-std; the sole remaining
    # `tracing-subscriber` in the tree is v0.3.23, the fixed line).
    # `cargo deny check advisories` confirms with an
    # `advisory-not-detected` warning — this ignore is now dead weight.

    # The default Linux CLI pulls in these crates through the Secret Service
    # keystore backend. Kit can select it automatically for encrypted keystore
    # writes. D-Bus traffic uses the same-UID session bus. These advisories
    # report unmaintained crates and list no defect.
    #
    # Drop all three ignores when the keyring store moves to secret-service 6
    # (still a release candidate) and zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant ships in the default Linux CLI through the Secret Service keystore backend; unmaintained advisory with no listed defect. Re-justify by 2027-02-17." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names ships through the same Linux Secret Service backend and handles names on the same-UID D-Bus session bus; unmaintained advisory with no listed defect. Re-justify by 2027-02-17." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive is a compile-time macro in the same Linux Secret Service dependency chain; unmaintained advisory with no listed defect. Re-justify by 2027-02-17." },
    # Drop this ignore when the MCP dependency graph no longer includes chrono.
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 is transitive through the opt-in MCP server and is absent from default release binaries. This unmaintained advisory lists no defect. Re-justify by 2027-02-17." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "Zlib",
    # libfuzzer-sys ships its LLVM-derived C shim under NCSA alongside
    # its Rust MIT/Apache-2.0. Pulled in only when --features libfuzzer
    # is enabled (not our default).
    "NCSA",
    # `option-ext` (transitive dep of ctap-hid-fido2 via the dirs-sys
    # path) ships under MPL-2.0. MPL-2.0 is a file-level copyleft —
    # modifications to MPL-licensed files must remain MPL, but
    # combining with differently-licensed code is allowed. Widely used
    # (Firefox, Thunderbird). Accepted for transitive use.
    "MPL-2.0",
    # webpki-roots / cert bundles used by rustls ship under the
    # Community Data License (CDLA) Permissive 2.0 — an OSI-aligned
    # permissive data license for the Mozilla CA trust store snapshot.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# The publish=false crates (benches, fuzz) depend on workspace siblings via bare
# `path = "..."` without a version pin, which cargo-deny treats as a
# wildcard. The 12 crates published to crates.io carry `version + path`
# internal deps (publishing requires it); the bare-path form is fine for
# the crates that never leave the workspace. Whitelist it.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
