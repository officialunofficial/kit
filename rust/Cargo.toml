[workspace]
resolver = "3"
members = [
    "crates/libkit",
    "crates/kit-core",
    "crates/kit-test-util",
    "crates/kit-rpc",
    "crates/kit-attest",
    "crates/kit-keystore",
    "crates/kit-git-bridge",
    "crates/kit-transport-memory",
    "crates/kit-transport-file",
    "crates/kit-serve",
    "crates/kit-transport-ssh",
    "crates/kit-transport-s3",
    "crates/kit-client",
    "crates/kit-transport-connect",
    "crates/kit-sign-file",
    "crates/kit-sync",
    "crates/kit-bin",
    "crates/kit-wasm",
    "fuzz",
    "benches",
    "crates/kit-formal-conformance",
]

[workspace.package]
version = "0.7.1"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/officialunofficial/kit"
authors = ["Official Unofficial, Inc."]

# Each version is a caret requirement. Its lower bound equals the version in
# Cargo.lock. scripts/check-dependency-versions.py checks this table.
[workspace.dependencies]
# default-features = false matches the strictest consumer (kit-core). A
# consumer that needs the default feature set must use a direct dependency,
# because `workspace = true` cannot re-enable default features.
commonware-storage = { version = "2026.10.0", default-features = false }
commonware-cryptography = { version = "2026.10.0", default-features = false }
commonware-codec = { version = "2026.10.0", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
# Flag `pub` items not reachable from the crate root: in a workspace this
# keeps internal APIs honestly scoped (`pub(crate)`) instead of leaking a
# wider surface than callers can actually use.
unreachable_pub = "warn"
# Kani proof harnesses live in `#[cfg(kani)]` modules next to the code they
# verify. `cargo kani` sets the cfg. Declare it so normal builds accept it.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)", "cfg(commonware_stability_BETA)", "cfg(commonware_stability_GAMMA)", "cfg(commonware_stability_DELTA)", "cfg(commonware_stability_EPSILON)", "cfg(commonware_stability_RESERVED)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Clippy checks every workspace package and cannot exempt one feature name.
redundant_feature_names = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# `doc_lazy_continuation` fires on style-only indentation in module docs.
# We use it intentionally for vertically-aligned bullet lists — the
# auto-fix rewrites prose into one-line-per-item form which hurts
# readability. Silence at the workspace root.
doc_lazy_continuation = "allow"
# `module_inception` is fine for our generated buffa modules.
module_inception = "allow"
# `assert!(x.is_empty())` reads better than the suggested
# `assert_eq!(x, [] as [T; 0])`, and the call sites are almost all tests.
assert_is_empty = "allow"
# Trait impls for async traits must stay `async fn` even when the body has no
# `.await`.
unused_async_trait_impl = "allow"
# Fixed-size record walks use `chunks_exact(N)`. Moving them to `as_chunks`
# is a separate change at each site.
chunks_exact_to_as_chunks = "allow"
# Downstream transitive deps (wit-bindgen via getrandom, hashbrown via tempfile)
# carry their own duplicate-version baggage we do not control. Revisit once
# the ecosystem converges.
multiple_crate_versions = "allow"
# Panicking on a `None`/`Err` hides failure modes from callers. Production code
# must surface errors via `?`/typed errors; tests are exempt
# (`allow-unwrap-in-tests` in clippy.toml), where a failed unwrap *is* the
# assertion.
unwrap_used = "deny"
# A stray `dbg!()` left in shipped code spams stderr and leaks internals.
# It's only ever a debugging aid, so fail the build rather than warn.
dbg_macro = "deny"
# Glob imports hide where a name comes from. `todo!()` is an unfinished path
# that panics at run time.
wildcard_imports = "deny"
todo = "deny"
# Every `unsafe` block needs a `// SAFETY:` comment that states the invariant
# and why it holds (AGENTS.md). scripts/check-unsafe-safety.sh repeats the
# check on the source text, so code under other targets and features is covered.
undocumented_unsafe_blocks = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
# Keep unwinding in release so a panic produces a real backtrace for users.
# Panics should be rare: production code bans `unwrap()` and uses
# `expect("reason")`.
panic = "unwind"
overflow-checks = true

# Profiling build: the release code generation with symbols and line tables,
# so a sampling profiler can name functions and lines. See docs/PROFILING.md.
[profile.profiling]
inherits = "release"
debug = true
strip = false
