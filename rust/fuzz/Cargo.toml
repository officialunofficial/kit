# cargo-fuzz crate. It IS a workspace member (see the root Cargo.toml
# `members` list), which is only safe because libfuzzer-sys is behind
# the optional `libfuzzer` feature — the default `cargo build` / `cargo
# test` never pulls it in (it's nightly-only on stable builds). Pass
# `--features libfuzzer` to `cargo fuzz run`; cargo-fuzz does not add it.
#
# Two execution paths:
#
# * `cd rust/fuzz && cargo +nightly fuzz run --features libfuzzer delta` — libfuzzer-sys
#   harness; the iteration counter inside each target body still
#   enforces the FUZZ.md guardrails.
# * `cd rust && cargo test --manifest-path fuzz/Cargo.toml` — plain unit-test
#   harness over the same target bodies, so CI catches regressions
#   even without nightly.
#
# Guardrails enforced in every target (see docs/FUZZ.md):
#   1. <= 100 iterations per target invocation.
#   2. <= 64 KiB input per iteration.
#   3. Bounded allocations: input cap (2) + per-op output caps inside
#      kit-core bound the worst-case heap to ~1 MiB per iteration.
#      kit-core uses the global allocator in production, so we do not
#      swap in a custom allocator in the fuzz harness — that would make
#      the harness diverge from production. See docs/FUZZ.md.
#   4. 100 ms wall-clock cap per iteration.
#   5. No unbounded loops; iteration counter mandatory.
#   6. Seeded RNG so failures reproduce.

[package]
name = "kit-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

# Fuzz code is not production code. Keep `clippy::all` and repeat the
# workspace rules on wildcard imports, `todo!` and unsafe blocks.
[lints.clippy]
all = { level = "warn", priority = -1 }
wildcard_imports = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[dependencies]
arbitrary = "1.5.0"
buffa = "0.9.2"
flate2 = "1.1.10"
kit-attest = { path = "../crates/kit-attest", features = ["grants"] }
kit-core = { path = "../crates/kit-core", features = ["sparse-checkout", "fuzzing"] }
kit-git-bridge = { path = "../crates/kit-git-bridge" }
kit-keystore = { path = "../crates/kit-keystore", features = ["fuzzing"] }
kit-rpc = { path = "../crates/kit-rpc", features = ["arbitrary"] }
kit-serve = { path = "../crates/kit-serve" }
kit-sync = { path = "../crates/kit-sync" }
kit-bin = { path = "../crates/kit-bin", features = ["fuzzing"] }
libkit = { path = "../crates/libkit", features = ["git-bridge", "transport-connect"] }
kit-transport-ssh = { path = "../crates/kit-transport-ssh" }
tar = "0.4.46"
tempfile = "3.27.0"

# libfuzzer-sys is gated on the `libfuzzer` feature so `cargo test`
# (stable, no nightly) doesn't pull it in. Pass `--features libfuzzer`
# to `cargo fuzz run`; cargo-fuzz does not add it.
libfuzzer-sys = { version = "0.4.13", optional = true }

# `minifuzz` (commonware-invariants) drives the in-process `#[test]`
# property runs — see the `rpc_decode` pilot in `src/lib.rs`. Dev-only:
# the libfuzzer binaries never touch it. Pinned to the commonware
# 2026.10.x train, same as the workspace-root commonware-* deps.
[dev-dependencies]
commonware-invariants = "2026.10.0"

[features]
default = []
libfuzzer = ["dep:libfuzzer-sys"]

[[bin]]
name = "delta"
path = "fuzz_targets/delta.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "pack"
path = "fuzz_targets/pack.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "tree"
path = "fuzz_targets/tree.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "software_key_record"
path = "fuzz_targets/software_key_record.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

[[bin]]
name = "rpc_decode"
path = "fuzz_targets/rpc_decode.rs"
test = false
doc = false
bench = false
required-features = ["libfuzzer"]

# When run as plain unit tests (no `--features libfuzzer`), the targets
# expose their guardrail-enforcing bodies via `pub fn run_unit_tests()`
# in each file. The shim below exposes them as `#[test]`s.
[lib]
path = "src/lib.rs"

