[package]
name = "kit-benches"
description = "Criterion benchmarks for hashing, signing, object commit, pack creation and object store writes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

# Bench code is not production code. Relax the pedantic lints and keep
# `clippy::all` as the correctness baseline.
[lints.clippy]
all = { level = "warn", priority = -1 }
doc_lazy_continuation = "allow"

# Each `[[bench]]` entry is one criterion suite.
[[bench]]
name = "hashing"
harness = false

[[bench]]
name = "sign_verify"
harness = false

[[bench]]
name = "object_commit"
harness = false

[[bench]]
name = "pack_create"
harness = false

[[bench]]
name = "store_write"
harness = false

# The library carries the sample types and the timing helpers.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
criterion = { version = "=0.8.2", default-features = false, features = ["plotters", "cargo_bench_support", "html_reports"] }
kit-core = { path = "../crates/kit-core" }
sha1 = "=0.11.0"
sha2 = "=0.11.0"
blake2 = "=0.11.0"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["alloc"] }
k256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }
tempfile = "=3.27.0"
git2 = "=0.21.0"
