# nextest configuration — `cargo nextest run` reads this file.
# See https://nexte.st/docs/configuration/

[profile.default]
# Most kit tests are sub-second; anything above 60 s is almost
# certainly a hang. Slow-test warnings fire at 10 s.
slow-timeout = { period = "10s", terminate-after = 6 }
# Don't retry on local runs — bugs should be reproducible, not papered
# over. CI overrides this in the `ci` profile below.
retries = 0
# Stop at the first failure when developing locally; CI overrides to
# surface the full failure surface.
fail-fast = true

[profile.ci]
# Surface every failure in one run on CI so we don't iterate through
# them one push at a time.
fail-fast = false
# Transient flakes in CI (network, fs latency) get one retry. A real
# bug fails twice; flakes succeed on the retry and are reported.
retries = 2
# Same slow-test envelope as default; CI machines vary so cap higher.
slow-timeout = { period = "30s", terminate-after = 4 }

[profile.ci.junit]
# Emit JUnit XML alongside the human-readable output so GitHub Actions
# can render failure annotations inline on PR diffs.
path = "junit.xml"

# The fault-injection suites rebuild many on-disk crash images and run many
# concurrent mutators, so each test spawns the binary many times. They are
# deterministic and do not hang. Give them a longer per-test ceiling, so a
# loaded runner does not kill them under the default envelope.
[[profile.default.overrides]]
filter = 'binary(crash_recovery) or binary(lock_contention)'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'binary(crash_recovery) or binary(lock_contention)'
slow-timeout = { period = "300s", terminate-after = 1 }

# The branch rename race test spawns the binary for every round and writes
# many padding files. It takes about 5 s alone and over 2 minutes on a loaded
# runner. It does not hang. Give it a longer ceiling.
[[profile.default.overrides]]
filter = 'binary(branch_rename_commit_race)'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'binary(branch_rename_commit_race)'
slow-timeout = { period = "300s", terminate-after = 1 }

# These fuzz checks include filesystem writes or subprocesses in a 100 ms
# iteration budget. Keep competing fixture work out of that timed window.
[[profile.default.overrides]]
filter = 'package(kit-fuzz) and test(/^(tests::unit_bridge_map|tests::unit_fetch_cursor_record|tests::pack_entries_target_runs_within_caps|tests::ssh_session_target_runs_within_caps)$/)'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'package(kit-fuzz) and test(/^(tests::unit_bridge_map|tests::unit_fetch_cursor_record|tests::pack_entries_target_runs_within_caps|tests::ssh_session_target_runs_within_caps)$/)'
threads-required = "num-test-threads"

# The bounded stateful suite (tests/state_machine.rs) spawns the binary for
# every operation. It does not hang, but a slow runner can drift toward the
# default ceiling.
[[profile.default.overrides]]
filter = 'test(=stateful_invariants)'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'test(=stateful_invariants)'
slow-timeout = { period = "300s", terminate-after = 1 }

# The history ancestry tests and the parallel tree-build fan-out test build
# large fixtures in the unoptimized profile. A loaded runner takes more than
# a minute. They do not hang. Give them a longer ceiling, and no retry.
[[profile.default.overrides]]
filter = 'package(kit-core) and (test(/history::ancestry::tests::/) or test(=worktree::tests::build_tree_parallel_fanout_assigns_each_hash_to_the_right_file))'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'package(kit-core) and (test(/history::ancestry::tests::/) or test(=worktree::tests::build_tree_parallel_fanout_assigns_each_hash_to_the_right_file))'
retries = 0
slow-timeout = { period = "300s", terminate-after = 1 }

# The default pack cap test pushes 300 MiB twice in the unoptimized profile.
# It takes about a minute and holds about 1 GiB. It does not hang.
[[profile.default.overrides]]
filter = 'test(=a_push_of_more_than_the_default_pack_cap_splits_unless_a_larger_cap_is_set)'
slow-timeout = { period = "300s", terminate-after = 1 }

[[profile.ci.overrides]]
filter = 'test(=a_push_of_more_than_the_default_pack_cap_splits_unless_a_larger_cap_is_set)'
slow-timeout = { period = "300s", terminate-after = 1 }

[profile.ignored-lane]
# A few tests need real subprocess sleeps, real timers or a real `ssh`
# connection. They sit behind `#[ignore]` instead of running in every test
# run. This profile names the tests that the serial ignored-only CI lane
# runs, so the workflow does not repeat the list:
#   cargo nextest run --profile ignored-lane --run-ignored ignored-only
#
# The lane uses an explicit name filter, not a plain `--run-ignored
# ignored-only`. The workspace has other `#[ignore]`d tests that CI runners
# do not provision: the native keystore backends (they need
# KIT_RUN_NATIVE_KEYSTORE_TESTS), the Docker-based S3 test and the
# recorders and profiling tools that run by hand. Some of these panic when
# their gate is unset, so a plain run would fail.
default-filter = 'test(/hang_before_stdout_times_out_and_reaps_child|fills_stderr_before_stdout_does_not_deadlock|valid_response_then_never_exits_is_bounded|open_accepts_syntactically_valid_kit_ssh_url|second_mutating_command_blocks_on_worktree_lock|gc_blocks_on_a_sibling_worktree_lock|wait_child_timeout_kills_stalled_child|ssh_clone_retries_past_a_dropped_first_connection|large_mixed_pack_decodes_under_production_resident_cap|chunked_id_at_the_chunk_cap_is_pinned|many_random_histories_plan_complete_packs|a_span_one_byte_over_the_cap|the_scan_covers_a_file_of_one_gibibyte|a_file_that_grows_past_the_limit|a_repository_with_many_branches_clones_fetches_and_pulls_over_ssh/) or binary(pack_entry_cost) or binary(pack_file_memory) or binary(pack_file_no_regression) or binary(large_file_clone) or binary(ssh_s3_streaming) or binary(connect_streaming_memory)'
# Run the tests one at a time, so their real timers and sockets do not
# contend. Only localhost networking is needed.
test-threads = 1
# Failures print in full, and no test retries.
retries = 0
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

# The pack residency test decodes more than 200 MiB on the wire and verifies
# every stored object. The unoptimized build takes more than 30 seconds, so
# it gets a longer ceiling on a slower runner.
[[profile.ignored-lane.overrides]]
filter = 'test(=large_mixed_pack_decodes_under_production_resident_cap)'
slow-timeout = { period = "300s", terminate-after = 1 }

# The file-backed pack reader tests read millions of entries or a few GiB
# of packs, and the memory tests count every allocation. The transfer memory
# tests push and fetch 1 GiB, over file, ssh and a loopback Connect server,
# and push 2 GiB of deltas.
# They do not hang. The S3 tests in `ssh_s3_streaming` need a store that
# the lane does not provision, so they skip there.
[[profile.ignored-lane.overrides]]
filter = 'binary(pack_entry_cost) or binary(pack_file_memory) or binary(pack_file_no_regression) or binary(large_file_clone) or binary(ssh_s3_streaming) or binary(connect_streaming_memory)'
slow-timeout = { period = "600s", terminate-after = 2 }

# The chunk-cap id test level-builds a tree of 8,388,609 leaves. The
# unoptimized build takes more than a minute.
[[profile.ignored-lane.overrides]]
filter = 'test(=merkle::tests::chunked_id_at_the_chunk_cap_is_pinned)'
slow-timeout = { period = "300s", terminate-after = 1 }

# These tests hash files above 1 GiB through the real chunker, which takes
# tens of seconds on a loaded runner. They do not hang.
[[profile.default.overrides]]
filter = 'binary(large_file_ingest) or binary(large_file_worktree)'
slow-timeout = { period = "120s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'binary(large_file_ingest) or binary(large_file_worktree)'
slow-timeout = { period = "120s", terminate-after = 3 }

# APFS durable writes dominate these heap measurements. Keep the same
# objects and memory assertions, but allow the filesystem barriers to finish.
[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'binary(pack_entry_cost)'
threads-required = "num-test-threads"
slow-timeout = { period = "120s", terminate-after = 5 }

[[profile.ci.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'binary(pack_entry_cost)'
threads-required = "num-test-threads"
slow-timeout = { period = "120s", terminate-after = 5 }

# These heap measurements include queued file barriers. Run their disk-backed
# fixtures without other tests competing for the same journal.

[[profile.default.overrides]]
filter = 'binary(pack_entry_cost)'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'binary(pack_entry_cost)'
threads-required = "num-test-threads"

# The 20,000-branch ssh test writes a tracking ref for each branch, in the
# clone and again in the fetch and the pull. It does not hang.
[[profile.ignored-lane.overrides]]
filter = 'test(=a_repository_with_many_branches_clones_fetches_and_pulls_over_ssh)'
slow-timeout = { period = "300s", terminate-after = 12 }

# Proof-boundary assertions build large valid inputs before refusing one byte.
[[profile.ignored-lane.overrides]]
filter = 'test(/many_random_histories_plan_complete_packs|a_span_one_byte_over_the_cap|the_scan_covers_a_file_of_one_gibibyte|a_file_that_grows_past_the_limit/)'
slow-timeout = { period = "120s", terminate-after = 5 }

# Large ref-listing fixtures contend with concurrent filesystem barriers on
# APFS. Reserve the pool for their 1,000 branches, as for the
# other disk-bound fixtures above. Allow the same five-minute ceiling when
# the workstation is busy with other builds.
[[profile.default.overrides]]
filter = 'binary(ssh_fetch_cursor) and test(=an_unchanged_fetch_of_1000_branches_is_one_request)'
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'binary(ssh_fetch_cursor) and test(=an_unchanged_fetch_of_1000_branches_is_one_request)'
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 5 }

# Publishing 5,001 tags and their maps takes thousands of filesystem barriers.
[[profile.default.overrides]]
filter = 'binary(ssh_tag_push) and test(=a_tag_push_spends_two_ssh_sessions_and_publishes_every_tag)'
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.ci.overrides]]
filter = 'binary(ssh_tag_push) and test(=a_tag_push_spends_two_ssh_sessions_and_publishes_every_tag)'
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 15 }

# The page cap test lists 1,001 refs of the longest names, each in its own
# directory, twice. It takes about 20 s alone and more on a busy runner.
[[profile.default.overrides]]
filter = 'binary(session) and test(=a_page_holds_at_most_the_cap_and_fits_a_frame)'
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'binary(session) and test(=a_page_holds_at_most_the_cap_and_fits_a_frame)'
slow-timeout = { period = "60s", terminate-after = 5 }

# Cloning 5,100 branches writes as many tracking refs, each with its own
# filesystem barrier, and a fetch and a pull follow. The test does not hang.
[[profile.default.overrides]]
filter = 'binary(ssh_many_branches) and test(=a_repository_with_thousands_of_branches_clones_fetches_and_pulls_over_ssh)'
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.ci.overrides]]
filter = 'binary(ssh_many_branches) and test(=a_repository_with_thousands_of_branches_clones_fetches_and_pulls_over_ssh)'
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 15 }

# These closure and pack checks build and remove many small files. Run them
# alone on APFS with the same five-minute ceiling as the history fixtures.
[[profile.default.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'package(kit-core) and test(/check_closure_present_above_polls_stop|random_packs_unpack_the_same_from_a_slice_and_a_file|random_tips_plan_within_the_single_tip_plans|the_plan_holds_everything_the_closure_difference_holds/)'
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
platform = 'cfg(target_os = "macos")'
filter = 'package(kit-core) and test(/check_closure_present_above_polls_stop|random_packs_unpack_the_same_from_a_slice_and_a_file|random_tips_plan_within_the_single_tip_plans|the_plan_holds_everything_the_closure_difference_holds/)'
threads-required = "num-test-threads"
retries = 0
slow-timeout = { period = "60s", terminate-after = 5 }
